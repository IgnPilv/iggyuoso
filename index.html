<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070d" />
    <title>iggyuoso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ff6a3d'/><stop offset='.5' stop-color='%23ff3d8b'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><rect x='14' y='14' width='9' height='36' rx='4.5' fill='white'/><rect x='27.5' y='14' width='9' height='24' rx='4.5' fill='white'/><rect x='41' y='14' width='9' height='36' rx='4.5' fill='white'/></svg>" />
    <script>
      // Resolve the theme before first paint so there is no flash (logic mirrors src/ui/theme.ts).
      (function () {
        var t;
        try { t = JSON.parse(localStorage.getItem('iggyuoso.settings') || '{}').theme; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
