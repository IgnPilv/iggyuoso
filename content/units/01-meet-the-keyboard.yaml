id: meet-the-keyboard
title: Meet the keyboard
summary: Find your way around the keys, learn finger numbers, note names, steady beat, the first note values, and your first notes on the staff. Hands apart.
lessons:
  - high-and-low
  - finger-numbers
  - c-d-e
  - f-g-a-b
  - steady-beat
  - half-and-whole-notes
  - middle-c-position
  - treble-staff
  - bass-staff
  - rests-and-taking-turns
  - ear-high-low
