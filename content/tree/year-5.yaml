year: 5
title: High intermediate
level: ABRSM Grade 6 (stretch Grade 7), RCM Levels 6–7
goal: >-
  Play 4-octave scales and arpeggios hands together, sight-read 16 bars with pedal and clef changes,
  understand chromatic harmony and modulation, pass an advanced ear battery, compose a harmonised
  16-bar piece, and give a graduation recital from memory.
units:
  - id: four-octave-scales
    title: Four-octave scales
    outline:
      technique: [4-octave scales hands together in D, F, A flat and B majors and minors, 4-octave chromatic and arpeggios]
  - id: advanced-reading
    title: Advanced reading
    checkpoint: y5-checkpoint-a
    outline:
      reading: [5/8, 5/4 and 9/8, triplets, clef changes, sustain pedal, 12–16 bars]
  - id: chromatic-harmony
    title: Chromatic harmony
    outline:
      theory: [Diminished sevenths, secondary dominants, suspensions]
      technique: [Dominant 7ths resolving to the tonic, diminished 7th arpeggios]
      ear: [Secondary dominants]
  - id: pivot-modulation
    title: Pivot-chord modulation
    checkpoint: y5-checkpoint-b
    outline:
      theory: [Pivot-chord modulation, interrupted and Phrygian cadences, figured bass basics]
      ear: [Name the modulation, two-voice dictation]
  - id: rhythm-and-style
    title: Rhythm and style
    outline:
      rhythm: [Hemiola, swing eighths, 2 against 3]
      theory: [Rondo and sonata form by listening and analysis]
      creativity: [Lead sheets with sevenths and slash chords]
      technique: [Optional scales in thirds and tenths]
  - id: graduation
    title: Graduation
    checkpoint: y5-exit
    outline:
      creativity: [Compose and perform a harmonised 16-bar piece]
      ear: [Four cadences, 7th chords and modulation in a no-feedback battery]
      repertoire: [Graduation recital of 4–5 works from memory, one per genre]
