year: 3
title: Keys widen, arpeggios arrive
level: ABRSM Grades 3–4, RCM Levels 4–5
goal: >-
  Play scales to 3–4 sharps or flats at quarter = 100 and 2-octave arpeggios, read 6/8 with upbeats
  and accidentals, understand V7 and cadences, recognise four cadence types, and play a sonatina
  movement and a 12-bar blues.
units:
  - id: flat-keys
    title: Flat keys
    outline:
      technique: [B flat, E flat, B minor and C minor hands together; B, F sharp and A flat hands apart]
      theory: [Keys to 4–5 sharps or flats, technical degree names, enharmonics]
  - id: compound-time
    title: Compound time
    checkpoint: y3-checkpoint-a
    outline:
      reading: [6/8, upbeats, accidentals, pause marks]
      rhythm: [Compound metre, dotted and syncopated figures in 6/8]
  - id: arpeggios
    title: Arpeggios
    outline:
      technique: [2-octave arpeggios hands apart then together, chromatic scale 2 octaves hands together]
      theory: [Diminished triad, chromatic scale]
      ear: [Harmonic intervals, diminished and augmented triads]
  - id: dominant-seventh
    title: The dominant seventh
    checkpoint: y3-checkpoint-b
    outline:
      theory: [V7 and inversions, the tritone and its resolution, perfect, plagal and imperfect cadences, cadential 6/4]
      technique: [I–V–I cadence pattern in each key]
      ear: [Plagal and interrupted cadences]
  - id: function-and-form
    title: Function and form
    outline:
      theory: ["Tonic, subdominant, dominant function", Passing and neighbour notes, Binary form, Writing an 8-bar melody]
      ear: [I–IV–V–I progressions, 4-bar melody playback]
  - id: sonatina-and-blues
    title: Sonatina and blues
    checkpoint: y3-exit
    outline:
      repertoire: [A sonatina movement, a two-voice piece, an etude]
      creativity: [12-bar blues with left-hand shell chords, lead sheets with vi]
