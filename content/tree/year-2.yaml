# Year 2: every unit is built node by node; each node's lesson has the same id.
year: 2
title: Two octaves, two hands
level: ABRSM Grades 2–3, RCM Levels 2–3
goal: >-
  Play 2-octave scales hands together in keys up to 2 sharps or flats, read hands together outside
  five-finger position, know interval quality and the three minor scales, harmonise with I–IV–V,
  and play one piece from each of the four genres.
units:
  - id: two-octave-scales
    title: Two-octave scales
    nodes:
      - { id: two-octave-c, type: lesson, strand: technique, lesson: two-octave-c, title: "C major over two octaves", requires: [y1-exit] }
      - { id: two-octave-c-together, type: lesson, strand: technique, lesson: two-octave-c-together, title: "Two octaves, hands together", requires: [two-octave-c] }
      - { id: seconds-major-minor, type: lesson, strand: theory, lesson: seconds-major-minor, title: "Major and minor 2nds", requires: [y1-exit] }
      - { id: thirds-major-minor, type: lesson, strand: theory, lesson: thirds-major-minor, title: "Major and minor 3rds", requires: [seconds-major-minor] }
      - { id: two-octave-g, type: lesson, strand: technique, lesson: two-octave-g, title: "G major over two octaves", requires: [two-octave-c-together] }
      - { id: two-octave-f, type: lesson, strand: technique, lesson: two-octave-f, title: "F major over two octaves", requires: [two-octave-g] }
      - { id: ear-all-degrees, type: drill, strand: ear, lesson: ear-all-degrees, title: "Hear every note of the scale", requires: [y1-exit] }
      - { id: scale-study-in-c, type: piece, strand: repertoire, lesson: scale-study-in-c, title: "Scale study in C", requires: [two-octave-c-together] }
  - id: reading-hands-together
    title: Reading hands together
    nodes:
      - { id: ties, type: lesson, strand: rhythm, lesson: ties, title: "Ties", requires: [y1-exit] }
      - { id: shifting-position, type: lesson, strand: reading, lesson: shifting-position, title: "Leaving the five-finger position", requires: [y1-exit] }
      - { id: two-note-chords, type: lesson, strand: reading, lesson: two-note-chords, title: "Two notes at once", requires: [shifting-position] }
      - { id: sixteenth-notes, type: lesson, strand: rhythm, lesson: sixteenth-notes, title: "Sixteenth notes", requires: [ties] }
      - { id: reading-ht-eight-bars, type: lesson, strand: reading, lesson: reading-ht-eight-bars, title: "Reading eight bars, hands together", requires: [two-note-chords, ties] }
      - { id: sight-reading-y2a, type: drill, strand: reading, lesson: sight-reading-y2a, title: "Sight-reading, hands together", requires: [reading-ht-eight-bars] }
      - { id: ear-echo-five, type: drill, strand: ear, lesson: ear-echo-five, title: "Echo five notes", requires: [ear-all-degrees] }
      - { id: minuet-first-half, type: piece, strand: repertoire, lesson: minuet-first-half, title: "Minuet in G, first half", requires: [reading-ht-eight-bars] }
  - id: minor-keys
    title: Minor keys
    nodes:
      - { id: relative-minor, type: lesson, strand: theory, lesson: relative-minor, title: "Relative major and minor", requires: [thirds-major-minor] }
      - { id: natural-minor, type: lesson, strand: theory, lesson: natural-minor, title: "The natural minor scale", requires: [relative-minor] }
      - { id: harmonic-minor, type: lesson, strand: theory, lesson: harmonic-minor, title: "The harmonic minor scale", requires: [natural-minor] }
      - { id: melodic-minor, type: lesson, strand: theory, lesson: melodic-minor, title: "The melodic minor scale", requires: [harmonic-minor] }
      - { id: two-octave-a-minor, type: lesson, strand: technique, lesson: two-octave-a-minor, title: "A minor over two octaves", requires: [harmonic-minor, two-octave-f] }
      - { id: two-octave-d-minor, type: lesson, strand: technique, lesson: two-octave-d-minor, title: "D minor over two octaves", requires: [two-octave-a-minor] }
      - { id: ear-cadences, type: drill, strand: ear, lesson: ear-cadences, title: "Finished or waiting?", requires: [ear-all-degrees] }
      - { id: korobeiniki, type: piece, strand: repertoire, lesson: korobeiniki, title: "Korobeiniki", requires: [harmonic-minor, reading-ht-eight-bars] }
      - { id: y2-checkpoint-a, type: checkpoint, strand: all, lesson: y2-checkpoint-a, title: "Year 2, checkpoint 1: scales, minor and reading", requires: [two-octave-d-minor, melodic-minor, ear-cadences, korobeiniki, sight-reading-y2a, sixteenth-notes, ear-echo-five, minuet-first-half, scale-study-in-c] }
  - id: inversions
    title: Chord inversions
    nodes:
      - { id: triads-on-every-degree, type: lesson, strand: theory, lesson: triads-on-every-degree, title: "A chord on every note", requires: [y2-checkpoint-a] }
      - { id: primary-triads, type: lesson, strand: theory, lesson: primary-triads, title: "The primary triads", requires: [triads-on-every-degree] }
      - { id: first-inversion, type: lesson, strand: technique, lesson: first-inversion, title: "First inversion", requires: [primary-triads] }
      - { id: second-inversion, type: lesson, strand: technique, lesson: second-inversion, title: "Second inversion", requires: [first-inversion] }
      - { id: close-position-chords, type: lesson, strand: technique, lesson: close-position-chords, title: "Chords that move smoothly", requires: [second-inversion] }
      - { id: staccato, type: lesson, strand: technique, lesson: staccato, title: "Staccato", requires: [y2-checkpoint-a] }
      - { id: perfect-intervals, type: lesson, strand: theory, lesson: perfect-intervals, title: "Perfect 4ths and 5ths", requires: [y2-checkpoint-a] }
      - { id: ear-melodic-intervals, type: drill, strand: ear, lesson: ear-melodic-intervals, title: "Hearing 3rds, 4ths and 5ths", requires: [perfect-intervals] }
      - { id: staccato-march, type: piece, strand: repertoire, lesson: staccato-march, title: "Toy-soldier march", requires: [staccato, close-position-chords] }
  - id: harmonising
    title: Harmonising a melody
    nodes:
      - { id: stable-unstable, type: lesson, strand: theory, lesson: stable-unstable, title: "Notes that rest, notes that pull", requires: [primary-triads] }
      - { id: harmonise-i-v, type: lesson, strand: creativity, lesson: harmonise-i-v, title: "Harmonising with two chords", requires: [stable-unstable] }
      - { id: harmonise-i-iv-v, type: lesson, strand: creativity, lesson: harmonise-i-iv-v, title: "Harmonising with three chords", requires: [harmonise-i-v, close-position-chords] }
      - { id: cadence-in-f, type: lesson, strand: theory, lesson: cadence-in-f, title: "The perfect cadence", requires: [harmonise-i-iv-v] }
      - { id: triplets, type: lesson, strand: rhythm, lesson: triplets, title: "Triplets", requires: [y2-checkpoint-a] }
      - { id: accompaniment-patterns, type: lesson, strand: creativity, lesson: accompaniment-patterns, title: "Accompaniment patterns", requires: [harmonise-i-iv-v] }
      - { id: transposing, type: lesson, strand: creativity, lesson: transposing, title: "Moving a tune to a new key", requires: [harmonise-i-v] }
      - { id: y2-checkpoint-b, type: checkpoint, strand: all, lesson: y2-checkpoint-b, title: "Year 2, checkpoint 2: chords and harmony", requires: [cadence-in-f, triplets, accompaniment-patterns, transposing, staccato-march, ear-melodic-intervals] }
  - id: pedal-and-genres
    title: Pedal and the four genres
    nodes:
      - { id: pedal-simple, type: lesson, strand: technique, lesson: pedal-simple, title: "The sustain pedal", requires: [y2-checkpoint-b] }
      - { id: pedal-legato, type: lesson, strand: technique, lesson: pedal-legato, title: "Legato pedal", requires: [pedal-simple] }
      - { id: chromatic-scale, type: lesson, strand: technique, lesson: chromatic-scale, title: "The chromatic scale", requires: [y2-checkpoint-b] }
      - { id: scales-d-major-e-minor, type: lesson, strand: technique, lesson: scales-d-major-e-minor, title: "D major and E minor", requires: [y2-checkpoint-b] }
      - { id: scales-a-major-g-minor, type: lesson, strand: technique, lesson: scales-a-major-g-minor, title: "A major and G minor", requires: [scales-d-major-e-minor] }
      - { id: syncopation, type: lesson, strand: rhythm, lesson: syncopation, title: "Syncopation", requires: [y2-checkpoint-b] }
      - { id: three-eight-time, type: lesson, strand: rhythm, lesson: three-eight-time, title: "3/8 time", requires: [syncopation] }
      - { id: ear-spot-the-change, type: drill, strand: ear, lesson: ear-spot-the-change, title: "Spot the change", requires: [y2-checkpoint-b] }
      - { id: ear-echo-six, type: drill, strand: ear, lesson: ear-echo-six, title: "Echo six notes", requires: [ear-spot-the-change] }
      - { id: etude-in-g, type: piece, strand: repertoire, lesson: etude-in-g, title: "Running etude in G", requires: [scales-d-major-e-minor] }
      - { id: minuet-in-g, type: piece, strand: repertoire, lesson: minuet-in-g, title: "Minuet in G, complete", requires: [y2-checkpoint-b] }
      - { id: variations-lightly-row, type: piece, strand: repertoire, lesson: variations-lightly-row, title: "Theme and variations", requires: [y2-checkpoint-b] }
      - { id: evening-song, type: piece, strand: repertoire, lesson: evening-song, title: "Evening song", requires: [pedal-legato] }
      - { id: y2-exit, type: checkpoint, strand: all, lesson: y2-exit, title: "Year 2 exit exam", requires: [chromatic-scale, scales-a-major-g-minor, three-eight-time, ear-echo-six, etude-in-g, minuet-in-g, variations-lightly-row, evening-song] }
