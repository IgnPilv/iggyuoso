id: relative-minor-quiz
title: "Relative keys"
kind: quiz
prompt: "Every major key has a relative minor that uses the same notes."
shuffle: true
questions:
  - { ask: "A minor is the relative minor of…", choices: ["C major", "G major", "F major"], correct: 0 }
