  - { ask: "The relative minor of G major is…", choices: ["D minor", "E minor", "A minor"], correct: 1 }
  - { ask: "The relative minor of F major is…", choices: ["D minor", "E minor", "C minor"], correct: 0 }
  - { ask: "A minor's key signature has…", choices: ["One sharp", "No sharps or flats, like C major", "One flat"], correct: 1 }
