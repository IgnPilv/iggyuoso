id: scale-pattern-quiz
title: Major scale pattern quiz
kind: quiz
shuffle: true
reps: 2
days: 2
questions:
- ask: The major scale pattern is...
  choices: [T T S T T T S, T T T T T T T, T S T T S T T]
  correct: 0
  why: Tone tone semitone, tone tone tone semitone.
- ask: In C major, where are the semitones?
  choices: [C–D and F–G, E–F and B–C, D–E and A–B]
  correct: 1
  why: 'Notes 3–4 and 7–8 of the scale: E–F and B–C.'
- ask: In any major scale, the semitones are between notes...
  choices: [2–3 and 6–7, 3–4 and 7–8, 1–2 and 5–6]
  correct: 1
  why: 'T T S: the third step. T T T S: the seventh.'
- ask: Which black key does G major need?
  choices: [F♯, C♯, B♭]
  correct: 0
  why: 'The 7th note must be a semitone below G: F♯.'
- ask: Which black key does F major need?
  choices: [E♭, B♭, F♯]
  correct: 1
  why: 'The 4th note must be a semitone above A: B♭.'
- ask: Which black keys does D major need?
  choices: [B♭ and E♭, F♯ only, F♯ and C♯]
  correct: 2
  why: 'D E F♯ G A B C♯ D: the pattern needs two sharps.'
- ask: How many different notes are in a major scale (not counting the top home note)?
  choices: [Seven, Five, Eight]
  correct: 0
  why: Seven letters; the eighth note is home again.
- ask: A scale goes from...
  choices: [Lowest key to highest key, Any note to any note, 'Home to home, an octave apart']
  correct: 2
  why: A scale climbs from its home note to the same note an octave up.
- ask: Which scale uses only white keys?
  choices: [G major, C major, F major]
  correct: 1
  why: On C, the pattern fits the white keys exactly.
- ask: What is the 5th note of G major?
  choices: [C, E, D]
  correct: 2
  why: G A B C D.
- {ask: 'Play the C major scale, going up.', play: C4 D4 E4 F4 G4 A4 B4 C5, why: All white keys from C to C.}
- {ask: 'Play the G major scale, going up from the G above middle C.', play: G4 A4 B4 C5 D5 E5 F#5 G5, why: F♯ is
    the only black key.}
