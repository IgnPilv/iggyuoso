- ask: In second inversion, the bottom note is the chord's...
  choices: [Root, 5th, 3rd]
  correct: 1
  why: Root and 3rd moved up; the 5th is lowest.
- ask: 'Right-hand fingers for a first inversion triad:'
  choices: [1 2 3, 1 3 5, 1 2 5]
  correct: 2
  why: The 4th sits at the top, between 2 and 5.
- ask: Where is the 4th in a second inversion triad?
  choices: [There isn't one, At the top, At the bottom]
  correct: 2
  why: G–C at the bottom of G C E.
