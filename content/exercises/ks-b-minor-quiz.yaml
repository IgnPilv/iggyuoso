id: ks-b-minor-quiz
title: 'Know the key: B minor'
kind: quiz
shuffle: true
reps: 1
days: 1
questions:
- ask: The key signature of B minor is...
  choices:
  - F♯, C♯, G♯
  - F♯
  - B♭, E♭
  - F♯, C♯
  correct: 3
  why: 'B minor: F♯, C♯.'
  whyStaff:
    notes: B4:w
    key: Bm
- ask: The notes of the B minor harmonic scale are...
  choices:
  - B C♯ D E F♯ G A♯
  - B C♯ D♯ E F♯ G♯ A♯
  correct: 0
  why: 'Count the steps: W H W W H W+H H.'
- ask: The tonic chord of B minor is...
  choices:
  - E G B
  - F♯ A♯ C♯ E
  - B D F♯
  correct: 2
  why: 'Degrees 1, 3, 5: B D F♯.'
- ask: The iv chord of B minor is...
  choices:
  - E G B
  - B D F♯
  - F♯ A♯ C♯ E
  correct: 0
  why: 'Degrees 4, 6, 8: E G B.'
- ask: The dominant 7th of B minor is...
  choices:
  - F♯ A♯ C♯ E
  - B D F♯
  - E G B
  correct: 0
  why: 'Built on degree 5, F♯: F♯ A♯ C♯ E.'
- ask: The dominant note of B minor is...
  choices:
  - E
  - C♯
  - F♯
  - G
  correct: 2
  why: Degree 5.
- ask: The leading note of B minor is...
  choices:
  - A♯
  - C♯
  - G
  correct: 0
  why: Degree 7, a half step below the tonic (raised in harmonic minor).
- ask: The relative major of B minor is...
  choices:
  - D major
  - A minor
  - B♭ major
  correct: 0
  why: They share a key signature.
