id: three-four-quiz
title: 3/4 time quiz
kind: quiz
shuffle: true
reps: 2
days: 2
questions:
- ask: In 3/4, how many beats are in each bar?
  choices: [Three, Four, Six]
  correct: 0
  why: The top number counts beats in a bar.
- ask: In 3/4, what kind of note gets one beat?
  choices: [A quarter note, An eighth note, A half note]
  correct: 0
  why: The bottom 4 means the beat is a quarter note.
- ask: Which beat is strongest in 3/4?
  choices: [Beat 3, Beat 2, Beat 1]
  correct: 2
  why: 'Beat 1 of every bar is the strong one: ONE, two, three.'
- ask: A dot after a note...
  choices: [Doubles it, Adds half its value, Makes it short]
  correct: 1
  why: 'A dot adds half: a half note (2) becomes 2 + 1 = 3.'
- ask: How many beats is a dotted half note?
  choices: [Two, Three, Four]
  correct: 1
  why: Half note 2, plus half of 2 = 1, makes 3.
  staff: C4:h.
- ask: Which dance is in 3/4?
  choices: [Rock song, March, Waltz]
  correct: 2
  why: Waltzes go 1-2-3, 1-2-3. Marches count in 2 or 4.
- ask: How many beats are in this bar?
  choices: [Three, Two, Four]
  correct: 0
  why: 2 + 1 = 3. It is a bar of 3/4.
  staff: C4:h E4:q
- ask: Which fills a whole bar of 3/4?
  choices: [A whole note, A dotted half note, A half note]
  correct: 1
  why: A dotted half is 3 beats, exactly one bar. A whole note (4) is too long.
- ask: Listen. Does it count in 3 or in 4?
  choices: ['4', '3']
  correct: 1
  why: 'The pattern repeats every three beats: ONE two three.'
  sound: C4:q E4:q E4:q | C4:q E4:q E4:q | C4:q E4:q E4:q
- ask: Listen. Does it count in 3 or in 4?
  choices: ['3', '4']
  correct: 1
  why: 'The low note comes back every four beats: ONE two three four.'
  sound: C4:q E4:q E4:q E4:q | C4:q E4:q E4:q E4:q | C4:q E4:q E4:q E4:q
- ask: Half note plus quarter note equals...
  choices: [Two beats, Three beats, Four beats]
  correct: 1
  why: '2 + 1 = 3: the same as a dotted half note.'
