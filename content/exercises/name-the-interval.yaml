- ask: When you count an interval, you count...
  choices: [Only the notes between, Only black keys, Both end notes and every letter between]
  correct: 2
  why: 'C to E is C, D, E: count both ends, so it is a 3rd.'
- ask: Line to the next space is always a...
  choices: [3rd, 5th, 2nd]
  correct: 2
  why: Line to space is the very next letter.
- ask: Odd intervals (3rds and 5ths) on the staff go...
  choices: [Line to space, Line to line or space to space, Off the staff]
  correct: 1
  why: Odd intervals keep to the same kind of place.
