id: ks-f-sharp-minor-quiz
title: 'Know the key: F♯ minor'
kind: quiz
shuffle: true
reps: 1
days: 1
questions:
- ask: The key signature of F♯ minor is...
  choices:
  - F♯, C♯
  - F♯, C♯, G♯, D♯
  - B♭, E♭, A♭
  - F♯, C♯, G♯
  correct: 3
  why: 'F♯ minor: F♯, C♯, G♯.'
  whyStaff:
    notes: F#4:w
    key: F#m
- ask: The notes of the F♯ minor harmonic scale are...
  choices:
  - F♯ G♯ A B C♯ D E♯
  - F♯ G♯ A♯ B C♯ D♯ E♯
  correct: 0
  why: 'Count the steps: W H W W H W+H H.'
- ask: The tonic chord of F♯ minor is...
  choices:
  - C♯ E♯ G♯ B
  - B D F♯
  - F♯ A C♯
  correct: 2
  why: 'Degrees 1, 3, 5: F♯ A C♯.'
- ask: The iv chord of F♯ minor is...
  choices:
  - B D F♯
  - C♯ E♯ G♯ B
  - F♯ A C♯
  correct: 0
  why: 'Degrees 4, 6, 8: B D F♯.'
- ask: The dominant 7th of F♯ minor is...
  choices:
  - C♯ E♯ G♯ B
  - B D F♯
  - F♯ A C♯
  correct: 0
  why: 'Built on degree 5, C♯: C♯ E♯ G♯ B.'
- ask: The dominant note of F♯ minor is...
  choices:
  - C♯
  - B
  - G♯
  - D
  correct: 0
  why: Degree 5.
- ask: The leading note of F♯ minor is...
  choices:
  - E♯
  - D
  - G♯
  correct: 0
  why: Degree 7, a half step below the tonic (raised in harmonic minor).
- ask: The relative major of F♯ minor is...
  choices:
  - A major
  - G major
  - E♭ major
  correct: 0
  why: They share a key signature.
