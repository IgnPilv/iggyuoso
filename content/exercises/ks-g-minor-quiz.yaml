id: ks-g-minor-quiz
title: 'Know the key: G minor'
kind: quiz
shuffle: true
reps: 1
days: 1
questions:
- ask: The key signature of G minor is...
  choices:
  - B♭, E♭
  - F♯, C♯
  - B♭, E♭, A♭
  - B♭
  correct: 0
  why: 'G minor: B♭, E♭.'
  whyStaff:
    notes: G4:w
    key: Gm
- ask: The notes of the G minor harmonic scale are...
  choices:
  - G A B C D E F♯
  - G A B♭ C D E♭ F♯
  correct: 1
  why: 'Count the steps: W H W W H W+H H.'
- ask: The tonic chord of G minor is...
  choices:
  - G B♭ D
  - C E♭ G
  - D F♯ A C
  correct: 0
  why: 'Degrees 1, 3, 5: G B♭ D.'
- ask: The iv chord of G minor is...
  choices:
  - D F♯ A C
  - G B♭ D
  - C E♭ G
  correct: 2
  why: 'Degrees 4, 6, 8: C E♭ G.'
- ask: The dominant 7th of G minor is...
  choices:
  - C E♭ G
  - D F♯ A C
  - G B♭ D
  correct: 1
  why: 'Built on degree 5, D: D F♯ A C.'
- ask: The dominant note of G minor is...
  choices:
  - A
  - D
  - C
  - E♭
  correct: 1
  why: Degree 5.
- ask: The leading note of G minor is...
  choices:
  - A
  - F♯
  - E♭
  correct: 1
  why: Degree 7, a half step below the tonic (raised in harmonic minor).
- ask: The relative major of G minor is...
  choices:
  - D major
  - E minor
  - B♭ major
  correct: 2
  why: They share a key signature.
