- ask: Two names for the same key are called...
  choices:
  - Relative
  - Enharmonic
  - Chromatic
  correct: 1
  why: 'Enharmonic: same sound, different spelling.'
- ask: In G major, the black key between F and G is written...
  choices:
  - F♯
  - G♭
  correct: 0
  why: G major has F♯ in its key signature, so it is spelled F♯.
- ask: In F major, the black key between A and B is written...
  choices:
  - B♭
  - A♯
  correct: 0
  why: 'F major has B♭: every letter used once, so it is B♭, not A♯.'
- ask: Why can a scale not use both F and F♯?
  choices:
  - Each letter appears once in a scale
  - They clash
  - It can, often
  correct: 0
  why: A major or minor scale uses each letter once; that decides the spelling.
