# The Book: theory to read, chapter by chapter. Format in content/README.md ("The Book").
# Chapters are content/book/<id>.md; this file gives their order and parts.
title: The Book
intro: |
  Music theory the way a music school teaches it in the first two years, written for a grown-up
  beginner. Each chapter explains one idea properly: what it is, why it matters, how it sounds,
  how it looks on the staff and the keys, and what usually trips people up. Pictures can be
  played, and the quick checks are there to try, not to pass.

  Every lesson that goes with a chapter opens with it, so you never have to come here first. But
  the Book is also meant to be read on its own, in order, like a textbook.
parts:
  - title: The keyboard, the sound and the page
    summary: What music is made of, the names of the keys, your hands, the beat, and the first notes on the staff.
    chapters: [sound-and-pitch, the-keyboard, hands-and-fingers, octaves, beat-and-note-values, the-staff, bass-clef, grand-staff, steps-and-skips]
  - title: Meter, sharps and flats, first chords
    summary: Bars and time signatures, counting, loud and soft, semitones, intervals, triads, chord names and numbers, and the first keys with sharps and flats.
    chapters: [time-signatures, counting, dynamics, semitones, intervals, triads, chord-symbols, key-of-g-and-f, why-keys]
  - title: Scales, rhythm and expression
    summary: Eighth notes and dotted rhythms, the major scale and its degrees, enharmonic spelling, tempo and touch words, and the road map of repeats.
    chapters: [eighth-notes, dotted-rhythms, major-scale, enharmonics, tempo-and-expression, road-map]
  - title: Minor keys and new signatures
    summary: Major and minor intervals and chords, the three minor scales, keys with two and three sharps or flats, the names of the degrees, ties, sixteenths and cut time.
    chapters: [major-and-minor-intervals, minor-keys, harmonic-and-melodic-minor, more-keys, degree-names, minor-chords, ties-and-sixteenths]
  - title: Chords and harmony
    summary: The chords of a key and their jobs, inversions, every interval by quality, tension and release, the perfect cadence, phrases and form, spelling scales, the progressions everyone uses, triplets, and harmonising a tune.
    chapters: [chords-in-a-key, inversions, interval-quality, tension-and-release, the-perfect-cadence, phrases-and-form, spelling-scales, progressions, triplets, harmonising]
  - title: The circle of keys, compound time and the pedal
    summary: The circle of fifths, simple and compound time, minor key signatures, transposing, spelling intervals, texture, the sustain pedal, syncopation and the chromatic scale.
    chapters: [circle-of-fifths, compound-time, minor-key-signatures, transposition, spelling-intervals, texture, the-pedal, syncopation, chromatic-scale]
  - title: Sevenths, cadences, new keys and the eras
    summary: The dominant 7th and the other seventh chords, the four cadences, changing key, and the four eras of keyboard music.
    chapters: [seventh-chords, four-cadences, modulation, four-eras]
  - title: Restless chords, decorations and every key
    summary: Augmented and diminished intervals and triads, notes outside the chord, all fifteen key signatures, secondary dominants, three against two, and how to describe a piece like a musician.
    chapters: [augmented-and-diminished, notes-outside-the-chord, every-key-signature, secondary-dominants, three-against-two, talking-about-a-piece]
