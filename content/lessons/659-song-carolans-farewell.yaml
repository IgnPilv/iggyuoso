id: song-carolans-farewell
title: Carolan's Farewell to Music
skills:
- songs
steps:
- explain: |
    **Carolan's Farewell to Music** · Turlough O'Carolan, 1738

    Said to be the last tune Carolan played, on his deathbed, before he handed the harp back.
  staff:
    notes: A4:e B4:e  |  C5:q B4:e A4:e G4:q A4:e B4:e
    key: Am
  sound: A4:e B4:e  |  C5:q B4:e A4:e G4:q A4:e B4:e  |  C5:q B4:e A4:e G4:q C5:e D5:e  |  E5:q D5:e E5:e C5:q B4:e A4:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: A minor · Time: 4/4 · Tempo: 88
