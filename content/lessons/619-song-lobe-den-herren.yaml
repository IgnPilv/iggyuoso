id: song-lobe-den-herren
title: Praise to the Lord, the Almighty
skills:
- songs
steps:
- explain: |
    **Praise to the Lord, the Almighty** · Stralsund hymn book, 1665; words by Joachim Neander, 1680

    "Lobe den Herren": a broad, swinging hymn in 3/4, sung in German and English churches alike.
  staff:
    notes: G4:q G4:q D5:q  |  B4:q A4:q G4:q
    key: G
  sound: G4:q G4:q D5:q  |  B4:q A4:q G4:q  |  F#4:q E4:q D4:q  |  E4:q F#4:q G4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 96
