id: pedal-legato
title: Legato pedal
skills: [technique, pedal]
steps:
- explain: |
    Simple pedal leaves a little gap between chords. **Legato pedal** (or *syncopated pedal*)
    joins them without a gap and without blurring them together. It feels backwards at first:
    1. Play the new chord.
    2. **Then** lift the pedal and press it straight down again.
  terms: [legato pedal, syncopated pedal]
- explain: |
    The foot moves *just after* the hands, not with them. The new chord is still held by the
    fingers while the pedal clears the old sound, then the pedal catches the new one.
  callout: |
    Hands down, then foot up-down.
- explain: |
    Change the pedal whenever the harmony changes. If two different chords ring together, that's a **blur**.
  check:
    ask: In legato pedal, the foot changes...
    choices: [Just before the new chord, With the new chord, Just after the new chord]
    correct: 2
    why: 'Hands first, then the foot: up and straight down again.'
- {exercise: pedal-legato-chords}
- {exercise: pedal-legato-broken}
- explain: |
    Theory check. Every answer comes with the reason, so a wrong one still teaches you something.
- {exercise: pedal-quiz}
recap: 'Hands first, then foot: up and down just after each new chord.'
