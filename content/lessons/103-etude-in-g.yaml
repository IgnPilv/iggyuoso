id: etude-in-g
title: "Running etude in G"
unit: pedal-and-genres
skills: [repertoire, etude]
steps:
  - explain: |
      The first of your four Year 2 pieces is an **etude**, a study for even, running fingers.
      Music-school exams always ask for one, alongside a polyphonic piece, a large-form piece and a
      character piece.

      The right hand runs in eighth notes the whole way. The point isn't speed but **evenness**:
      every note the same length and the same loudness. Use the tempo ladder: one clean take at
      each step before you move up.
  - exercise: etude-in-g
recap: "An etude trains one thing. This one trains even fingers."
