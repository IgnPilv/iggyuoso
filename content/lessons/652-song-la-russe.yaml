id: song-la-russe
title: La Russe
skills:
- songs
steps:
- explain: |
    **La Russe** · English country dance, 1800s

    Despite the name, an English ballroom dance for four couples, still danced at ceilidhs.
  staff:
    notes: B4:e A4:e  |  G4:q B4:e B4:e B4:q D5:e D5:e
    key: G
  sound: B4:e A4:e  |  G4:q B4:e B4:e B4:q D5:e D5:e  |  D5:q G5:q G5:q F#5:e G5:e  |  A5:q G5:q E5:q C#5:q
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
