title: The Wearin' o' the Green
skills:
- songs
steps:
- explain: |
    **The Wearin' o' the Green** · Irish street ballad, about 1798

    A song from the Irish rising of 1798, when wearing a green ribbon could get you arrested.
  staff:
    notes: G4:s A4:s  |  B4:e B4:e B4:e B4:e
    key: G
  sound: G4:s A4:s  |  B4:e B4:e B4:e B4:e  |  B4:e D5:e D5:e. B4:s  |  B4:e A4:e A4:e A4:e
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 72
