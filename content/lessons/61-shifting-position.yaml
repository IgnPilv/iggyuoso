id: shifting-position
title: Leaving the five-finger position
skills: [reading, hand-position]
steps:
- explain: |
    Until now each piece sat in one place: five fingers over five keys. Real music moves around.
    There are two ways to reach new notes.
- explain: |
    **Move the hand**: during a rest or a long note, lift the whole hand and land in the new
    place, already shaped.
  staff: {notes: 'C4:q D4:q E4:q r:q | G4:q A4:q B4:q C5:q'}
  terms: [shift]
- explain: |
    **Stretch**: open the hand wider to reach a note outside the five keys, then close again.
    Look ahead on the sheet so you know where the hand is going *before* it has to go.
  terms: [stretch, extension]
  callout: |
    Move during rests or long notes. Stretch for one-off notes.
  check:
    ask: The best moment to move your hand to a new position is...
    choices: [During a rest or a long note, In the middle of a run, 'Never: always stretch']
    correct: 0
    why: That gives the hand time to land shaped and ready.
- {exercise: shift-up-rh}
- {exercise: shift-lh}
- {exercise: stretch-rh}
recap: Move during rests, stretch for one-off notes, and always read a little ahead.
