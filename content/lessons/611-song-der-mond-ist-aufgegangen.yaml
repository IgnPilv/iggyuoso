id: song-der-mond-ist-aufgegangen
title: Der Mond ist aufgegangen
skills:
- songs
steps:
- explain: |
    **Der Mond ist aufgegangen** · J. A. P. Schulz, 1790; words by Matthias Claudius, 1779

    "The moon has risen": the best-loved German evening song, quiet and plain, sung at bedtime and in church.
  staff:
    notes: G4:q  |  A4:q G4:q C5:q B4:q
    key: G
  sound: G4:q  |  A4:q G4:q C5:q B4:q  |  A4:h G4:q B4:q  |  B4:q B4:q E5:q D5:q
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
