title: The Lark in the Clear Air
skills:
- songs
steps:
- explain: |
    **The Lark in the Clear Air** · Irish air, words by Samuel Ferguson, 1800s

    A gentle Irish love song: the singer will tell her his love when the lark sings in the clear air.
