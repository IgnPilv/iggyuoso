- exercise: song-hunt-the-squirrel-rh
- exercise: song-hunt-the-squirrel-lh
- exercise: song-hunt-the-squirrel
- exercise: song-hunt-the-squirrel-arranged
- exercise: song-hunt-the-squirrel-performance
recap: 'Hunt the Squirrel: tune, left hand, together. Come back to it any time; songs are for fun.'
