- exercise: song-campbells-are-coming-lh
- exercise: song-campbells-are-coming
- exercise: song-campbells-are-coming-arranged
- exercise: song-campbells-are-coming-performance
recap: 'The Campbells Are Coming: tune, left hand, together. Come back to it any time; songs are for fun.'
