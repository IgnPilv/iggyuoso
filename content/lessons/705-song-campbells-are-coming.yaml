id: song-campbells-are-coming
title: The Campbells Are Coming
skills:
- songs
steps:
- explain: |
    **The Campbells Are Coming** · Scottish tune, 1700s

    A clan song in 6/8 about the Campbells marching, said to date from the Jacobite rising of 1715.
  staff:
    notes: G4:e  |  B4:q E5:e D5:e B4:e G4:e
    key: G
  sound: G4:e  |  B4:q E5:e D5:e B4:e G4:e  |  A4:e. B4:s A4:e A4:q G4:e  |  B4:q E5:e D5:e B4:e G4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
