id: ear-all-degrees
title: Hear every note of the scale
skills: [ear, scale-degrees]
steps:
- explain: |
    In Year 1 you found degrees 1, 3 and 5 after a cadence. Now we add the rest.
    Each degree has its own feeling in the key.
  sound: C4+E4+G4:h F4+A4+C5:h G3+B3+D4:h C4+E4+G4:h | B4:h C5:h
  terms: [scale degree, leading note]
- explain: |
    **7** (the **leading note**) leans hard up to the tonic. **4** wants to fall to 3.
    **2** hovers and wants to step down to 1. **6** sinks to 5.
    After each answer the app lets the note resolve home, so you hear where it was pulling.
  callout: |
    7 → 8 up. 4 → 3 down. 2 → 1 down. 6 → 5 down.
  check:
    ask: Which degree pulls hardest up to the tonic?
    choices: ['2', '4', '7']
    correct: 2
    why: The leading note is only a semitone below home, so it leans right into it.
- {exercise: ear-degrees-c-1235}
- {exercise: ear-degrees-c-all}
- explain: |
    Same feelings, different key. That is the point: degrees are about the *pull*, not the
    letter names.
- {exercise: ear-degrees-g-all}
recap: Every degree has a pull. Listen for where it wants to go, not for its letter name.
