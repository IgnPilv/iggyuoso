id: ear-all-degrees
title: "Hear every note of the scale"
unit: two-octave-scales
skills: [ear, scale-degrees]
steps:
  - explain: |
      In Year 1 you found degrees 1, 3 and 5 after a cadence. Now we add the rest.

      Each degree has its own feeling in the key. **7** leans hard up to the tonic. **4** wants to
      fall to 3. **2** hovers and wants to step down to 1. After each answer the app lets the note
      resolve home, so you hear where it was pulling.
  - exercise: ear-degrees-c-1235
  - exercise: ear-degrees-c-all
  - explain: |
      Same feelings, different key. That is the point: degrees are about the *pull*, not the
      letter names.
  - exercise: ear-degrees-g-all
recap: "Every degree has a pull. Listen for where it wants to go, not for its letter name."
