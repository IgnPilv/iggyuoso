    notes: F#4:h B3:e C#4:e D4:e E4:e  |  F#4:h. D4:q
    key: Bm
  sound: F#4:h B3:e C#4:e D4:e E4:e  |  F#4:h. D4:q  |  F#4:h. D4:q  |  F#4:h. B3:q
- explain: |
    **Before you play.** B minor: F♯ and C♯. Long notes: let them sing for their full value.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: B minor · Time: 4/4 · Tempo: 66
