id: song-humours-of-donnybrook
title: The Humours of Donnybrook
skills:
- songs
steps:
- explain: |
    **The Humours of Donnybrook** · Irish jig, 1800s

    Donnybrook Fair in Dublin was so rowdy that "a donnybrook" came to mean a brawl.
  staff:
    notes: D5:s3 E5:s3 F#5:s3  |  G5:q G4:e G4:e F#4:e G4:e
    key: G
  sound: D5:s3 E5:s3 F#5:s3  |  G5:q G4:e G4:e F#4:e G4:e  |  E4:e G4:e G4:e D4:e G4:e G4:e  |  G5:q G4:e G4:e F#4:e G4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
