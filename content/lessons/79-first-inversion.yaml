id: first-inversion
title: "First inversion"
unit: inversions
skills: [technique, inversions, theory]
steps:
  - explain: |
      A chord doesn't have to have its root at the bottom. Move the root up an octave and the
      **3rd** is now the lowest note: that is the **first inversion**. C E G becomes **E G C**.

      It is still a C major chord (same three letters), just stacked differently. The shape changes:
      now there is a 4th at the top (G to C). Use fingers **1 2 5** in the right hand.
  - exercise: build-first-inversions
  - exercise: root-and-first-rh
recap: "First inversion: the 3rd at the bottom. Same chord, new shape."
