steps:
- explain: |
    **John Peel** · Cumbrian song, 1820s

    "D'ye ken John Peel": a song about a famous huntsman from the Lake District, to an older Scottish tune.
  staff:
    notes: C#5:e D5:e  |  E5:q E5:q C#5:q C#5:e D5:e
    key: A
