id: song-canon-lines
title: 'Canon in D 2: the first lines'
skills:
- songs
steps:
- explain: |
    **The first line** is one note to each bass note, falling by step from F♯ to A and back up to C♯. **The second
    line** is the same shape a third lower, from D. In the real Canon, while the first violin plays line 2, the second
    violin plays line 1 under it: the canon.

    Each tune note is a note of the chord above its bass: F♯ over D, E over A, D over B, C♯ over F♯.
  staff:
    notes: F#5:q E5:q D5:q C#5:q | B4:q A4:q B4:q C#5:q | D5:q C#5:q B4:q A4:q | G4:q F#4:q G4:q E4:q
    key: D
  sound: D3+F#5:q A2+E5:q B2+D5:q F#2+C#5:q | G2+B4:q D2+A4:q G2+B4:q A2+C#5:q | D3+D5:q A2+C#5:q B2+B4:q F#2+A4:q | G2+G4:q
    D2+F#4:q G2+G4:q A2+E4:q
  terms:
  - canon
  - step
  - chord tone
- explain: |
    **Hear the canon.** Line 1 alone, then line 2 with line 1 above it, as two violins play it: the
    second violin plays the tune the first one started two bars earlier.
  sound: F#5:q E5:q D5:q C#5:q | B4:q A4:q B4:q C#5:q | D5+F#5:q C#5+E5:q B4+D5:q A4+C#5:q | G4+B4:q F#4+A4:q G4+B4:q E4+C#5:q
  staff:
    notes: F#5:q E5:q D5:q C#5:q | B4:q A4:q B4:q C#5:q | D5:q C#5:q B4:q A4:q | G4:q F#4:q G4:q E4:q
    key: D
  check:
    ask: In a canon, the second voice...
    choices:
    - Plays a different tune
    - Plays the same tune, starting later
    - Plays the bass
    - Plays the same tune at the same time
    correct: 1
    why: 'A canon is one tune in several voices, each starting later: like a round.'
- exercise: song-canon-lines-echo
- exercise: song-canon-lines-rh
- exercise: song-canon-lines-1
- exercise: song-canon-lines-both
recap: 'The first lines: one note to each bass note, falling by step.'
