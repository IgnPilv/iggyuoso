id: song-wim
title: Where Is My Mind (Maxence Cyrin)
skills:
- songs
steps:
- explain: |
    **Where Is My Mind**, the whole song: intro, verse, "ooh", break, second verse with the rolling left hand, "ooh",
    chorus and the riff again to finish. 44 bars.

    Three versions, easiest first: the tune over bass notes, then over bass and chord, then Maxence Cyrin's full
    arrangement with the rolling left hand. The last take adds the pedal, changing with every chord.
