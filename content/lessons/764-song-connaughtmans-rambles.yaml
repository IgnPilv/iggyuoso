title: The Connaughtman's Rambles
skills:
- songs
steps:
- explain: |
    **The Connaughtman's Rambles** · Irish jig, 1800s

    One of the best-known jigs, about a man from Connacht in the west of Ireland.
  staff:
    notes: A4:e  |  F#4:e A4:e A4:e D5:e A4:e A4:e
    key: D
  sound: A4:e  |  F#4:e A4:e A4:e D5:e A4:e A4:e  |  B4:e A4:e B4:e D5:e A4:e G4:e  |  F#4:e A4:e A4:e A4:e F#5:e E5:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 6/8 · Tempo: 56
