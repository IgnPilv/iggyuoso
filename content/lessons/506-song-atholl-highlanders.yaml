id: song-atholl-highlanders
title: The Atholl Highlanders
skills:
- songs
steps:
- explain: |
    **The Atholl Highlanders** · Scottish jig, 1800s

    Named after the Duke of Atholl's private regiment, the only private army left in Europe. A favourite jig of pipers and fiddlers.
  staff:
    notes: C#5:s D5:s  |  E5:q. E5:e C#5:e A4:e
    key: A
  sound: C#5:s D5:s  |  E5:q. E5:e C#5:e A4:e  |  E5:e C#5:e A4:e B4:e C#5:e D5:e  |  E5:q. E5:e C#5:e A4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. A major: remember F♯, C♯, G♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: A major · Time: 6/8 · Tempo: 56
