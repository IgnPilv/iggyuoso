id: song-lieber-augustin
title: O du lieber Augustin
skills:
- songs
steps:
- explain: |
    **O du lieber Augustin** · Viennese song, about 1800

    Augustin, a Viennese street singer, is said to have fallen drunk into a plague pit in 1679 and climbed out alive. English children sing the tune as "Did You Ever See a Lassie?".
  staff:
    notes: D5:q. E5:e D5:e C5:e  |  B4:q G4:q G4:q
    key: G
  sound: D5:q. E5:e D5:e C5:e  |  B4:q G4:q G4:q  |  A4:q D4:q D4:q  |  B4:q G4:q G4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 96
