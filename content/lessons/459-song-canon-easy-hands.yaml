id: song-canon-easy-hands
title: 'Pachelbel''s Canon, easy 4: both hands'
skills:
- songs
steps:
- explain: |
    **Hands together.** In lines 1 and 2 both hands play at the same moment: every tune note has its bass note. The
    tune falls while the bass jumps around below it.

    In line 3 the right hand plays two notes to each one of the left: "**both**, right, **both**, right". Practise each
    line slowly, then join them.
