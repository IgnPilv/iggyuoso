id: ear-major-minor
title: "Major and minor"
unit: two-hands-at-once
skills: [listening, chord-quality]
steps:
  - explain: |
      Most music has a **mood**. **Major** chords sound bright and settled. **Minor** chords
      sound darker, softer or sadder. People often say "happy" and "sad", though it's more
      subtle than that.

      Don't think too hard. Listen to the colour and trust your first feeling.
  - exercise: ear-major-minor-chords
recap: "Major = bright. Minor = darker. Trust your first impression."
