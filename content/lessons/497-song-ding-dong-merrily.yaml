title: Ding Dong Merrily on High
skills:
- songs
steps:
- explain: |
    **Ding Dong Merrily on High** · French dance tune "Branle de l'Official", 1589

    The tune was a dance in a French book of 1589. The long "Gloria" falls like bells pealing down a tower.
  staff:
    notes: G4:q G4:q A4:e G4:e F#4:e E4:e  |  D4:h D4:h
    key: G
  sound: G4:q G4:q A4:e G4:e F#4:e E4:e  |  D4:h D4:h  |  E4:q G4:q G4:q F#4:q  |  G4:h G4:h
- explain: |
    **Before you play.** The chorus is a sequence: the same little run, a step lower each bar.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 100
