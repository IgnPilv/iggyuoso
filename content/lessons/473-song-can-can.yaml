- exercise: song-can-can-by-ear
- exercise: song-can-can-rh
- exercise: song-can-can-lh
- exercise: song-can-can
- exercise: song-can-can-arranged
- exercise: song-can-can-performance
recap: 'Can-Can: tune, left hand, together. Come back to it any time; songs are for fun.'
