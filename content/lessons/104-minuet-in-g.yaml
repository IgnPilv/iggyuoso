id: minuet-in-g
title: Minuet in G, complete
skills: [repertoire, baroque, polyphony]
steps:
- explain: |
    Your **polyphonic** piece: the whole Minuet in G. You learned the first half earlier. The
    second half starts the same way and then ends differently.
- explain: |
    The first half finishes on A (chord V, an **imperfect** cadence), the second on G (a **perfect** cadence, home).
    Make the two hands sound like two singers. Baroque music is played with clear, light fingers and **no pedal**.
  check:
    ask: The first half of the minuet ends on chord V. That is...
    choices: [An imperfect cadence, A perfect cadence]
    correct: 0
    why: Ending on V is a comma; the second half brings it home.
- {exercise: minuet-first-half}
- {exercise: minuet-in-g}
recap: Two voices, sixteen bars, imperfect cadence then perfect.
