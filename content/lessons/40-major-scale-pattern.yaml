id: major-scale-pattern
title: The major scale
unit: scales-and-eighths
skills: [scales, tones-and-semitones]
steps:
- explain: |
    A **scale** is the notes of a key in order, from home to home. Listen to C major.
  staff: {notes: 'C4:q D4:q E4:q F4:q | G4:q A4:q B4:q C5:q', labels: names}
  sound: C4:q D4:q E4:q F4:q G4:q A4:q B4:q C5:q
  terms: [scale, C major]
- explain: |
    Every major scale follows the same pattern of steps:
    **tone, tone, semitone, tone, tone, tone, semitone** (T T S T T T S).
    In C the two semitones are **E–F** and **B–C**, exactly where the white keys have no black key between them.
  keys: {notes: C4 D4 E4 F4 G4 A4 B4 C5, labels: names}
  terms: [T T S T T T S]
  check:
    ask: In a major scale, between notes 3 and 4 there is a...
    choices: [Semitone, Tone]
    correct: 0
    why: 'T T **S**: the third step is the first semitone (E–F in C).'
- explain: |
    On C the pattern lands on white keys only. Start anywhere else and the pattern tells you which black
    keys you need. From G: G–A tone, A–B tone, B–C semitone, C–D tone, D–E tone, then E needs a **tone** to the next note,
    so that note is **F♯**, and F♯–G is the last semitone.
  keys: {notes: G4 A4 B4 C5 D5 E5 F#5 G5, labels: names}
  sound: G4:q A4:q B4:q C5:q D5:q E5:q F#5:q G5:q
  callout: |
    That's where key signatures come from: the pattern decides the sharps and flats.
- explain: |
    From F the 4th note must be only a semitone above A, so it is **B♭**, not B.
  keys: {notes: F4 G4 A4 Bb4 C5 D5 E5 F5, labels: names}
  check:
    ask: Using the pattern, which black key does D major need on its 3rd note?
    choices: [E♭, F♭, F♯]
    correct: 2
    why: 'D to E is a tone, E to the 3rd note must be a tone too: F♯.'
- {exercise: scale-pattern-quiz}
- {exercise: build-major-scales}
recap: Major scale = T T S T T T S. The pattern decides the sharps and flats.
