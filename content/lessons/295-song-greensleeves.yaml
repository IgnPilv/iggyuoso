steps:
- explain: |
    **Greensleeves** · English ballad, 1500s

    A tune from Tudor England, in A minor. The G♯ and F♯ come from the melodic minor scale you learned.
  staff:
    notes: A4:q  |  C5:h D5:q
    key: Am
  sound: A4:q  |  C5:h D5:q  |  E5:q. F5:e E5:q  |  D5:h B4:q
- explain: |
    **Before you play.** Watch for G♯ (leading note) going up to A, and F♯ in the bar before the end.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: A minor · Time: 3/4 · Tempo: 84
