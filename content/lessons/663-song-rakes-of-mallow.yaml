id: song-rakes-of-mallow
title: The Rakes of Mallow
skills:
- songs
steps:
- explain: |
    **The Rakes of Mallow** · Irish polka, 1700s

    About the young idlers of Mallow, a County Cork spa town. One of the easiest Irish tunes to whistle.
  staff:
    notes: G4:e B4:e G4:e B4:e  |  G4:e B4:e C5:s B4:s A4:s G4:s
    key: G
  sound: G4:e B4:e G4:e B4:e  |  G4:e B4:e C5:s B4:s A4:s G4:s  |  F#4:e A4:e F#4:e A4:e  |  F#4:e A4:e D5:s C5:s B4:s A4:s
- explain: |
    **Before you play.** Two beats in a bar, like a march. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 72
