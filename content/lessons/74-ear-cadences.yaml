id: ear-cadences
title: Finished or waiting?
skills: [ear, cadences]
steps:
- explain: |
    A **cadence** is the way a phrase ends, like punctuation in a sentence.
  terms: [cadence]
- explain: |
    A **perfect cadence** goes from chord **V to chord I**: a full stop. It sounds finished.
  sound: C4+E4+G4:h F4+A4+C5:h | G3+B3+D4+G4:h C4+E4+G4+C5:h
  terms: [perfect cadence]
- explain: |
    An **imperfect cadence** ends **on chord V**: a comma. It sounds like a question waiting for an answer.
  sound: C4+E4+G4:h F4+A4+C5:h | C4+E4+G4:h G3+B3+D4+G4:h
  terms: [imperfect cadence]
  callout: |
    Ask yourself: could the piece end here?
  check:
    ask: A phrase ends on chord V. The cadence is...
    choices: [Perfect, Imperfect]
    correct: 1
    why: 'Ending on V leaves the music waiting: imperfect.'
- {exercise: ear-cadences}
recap: Perfect cadence (V–I) = full stop. Imperfect (ends on V) = comma.
