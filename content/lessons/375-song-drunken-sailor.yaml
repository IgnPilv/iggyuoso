id: song-drunken-sailor
title: What Shall We Do with the Drunken Sailor?
skills:
- songs
steps:
- explain: |
    **What Shall We Do with the Drunken Sailor?** · Sea shanty, England

    Sailors sang shanties to pull ropes together. This one is in the *Dorian mode*: a minor sound with a bright B natural.
  staff:
    notes: A4:h A4:h  |  A4:q D4:q F4:q A4:q
  sound: A4:h A4:h  |  A4:q D4:q F4:q A4:q  |  G4:h G4:h  |  G4:q C4:q E4:q G4:q
- explain: |
    **Before you play.** Strong beats: pull on beats 1 and 3, like hauling a rope.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 112
