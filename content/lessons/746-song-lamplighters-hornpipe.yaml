steps:
- explain: |
    **The Lamplighter's Hornpipe** · English hornpipe, 1800s

    Named for the lamplighters who went round the streets at dusk lighting the gas lamps.
  staff:
    notes: C#5:e D5:e  |  E5:e C#5:e C#5:e C#5:e E5:e A5:e G#5:e F#5:e
    key: A
  sound: C#5:e D5:e  |  E5:e C#5:e C#5:e C#5:e E5:e A5:e G#5:e F#5:e  |  E5:e A4:e A4:e E5:e E5:e A5:e G#5:e F#5:e  |  F#5:e
    E5:e C#5:e E5:e F#5:e E5:e D5:e C#5:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. A major: remember F♯, C♯, G♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: A major · Time: 4/4 · Tempo: 88
