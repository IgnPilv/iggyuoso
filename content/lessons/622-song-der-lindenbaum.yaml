id: song-der-lindenbaum
title: Der Lindenbaum
skills:
- songs
steps:
- explain: |
    **Der Lindenbaum** · Franz Schubert, 1827, in the folk version by Friedrich Silcher, 1846

    "By the well before the gate there stands a linden tree": a song from Schubert's Winterreise that Germans took up as a folk song, in Silcher's simpler version.
  staff:
    notes: C5:e  |  C5:q. A4:e A4:e A4:e
    key: F
  sound: C5:e  |  C5:q. A4:e A4:e A4:e  |  A4:q F4:q r:e F4:e  |  G4:q. A4:e Bb4:e G4:e
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. F major: remember B♭.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: F major · Time: 3/4 · Tempo: 80
