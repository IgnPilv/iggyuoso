    notes: D5:s C#5:s D5:s D4:s C#4:s A4:s E4:s F#4:s D4:s D5:s C#5:s B4:s C#5:s F#5:s A5:s B5:s | G5:s F#5:s E5:s G5:s F#5:s
      E5:s D5:s C#5:s B4:s A4:s G4:s F#4:s E4:s G4:s F#4:s E4:s
    key: D
  sound: D2+D5:s C#5:s A2+D5:s D4:s A2+C#4:s A4:s E3+E4:s F#4:s B2+D4:s D5:s F#3+C#5:s B4:s F#2+C#5:s F#5:s C#3+A5:s B5:s
    | G2+G5:s F#5:s D3+E5:s G5:s D2+F#5:s E5:s A2+D5:s C#5:s G2+B4:s A4:s D3+G4:s F#4:s A2+E4:s G4:s E3+F#4:s E4:s
