id: song-westminster
title: Westminster Chimes
skills:
- songs
steps:
- explain: |
    **Westminster Chimes** · Clock chime, Cambridge 1793, Big Ben since 1859

    Big Ben in London plays these four-note "changes" every quarter of an hour, and the full set on the hour. The tune was written for a church in Cambridge in 1793.
  staff:
    notes: E4:q D4:q C4:q  |  G3:h.
  sound: E4:q D4:q C4:q  |  G3:h.  |  C4:q E4:q D4:q  |  G3:h.
- explain: |
    **Before you play.** Let each long note ring like a bell, all three beats. The left hand rings low with it.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 3/4 · Tempo: 80
