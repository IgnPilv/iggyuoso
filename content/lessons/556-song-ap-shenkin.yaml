id: song-ap-shenkin
title: Ap Shenkin
skills:
- songs
steps:
- explain: |
    **Ap Shenkin** · Welsh dance tune, 1700s

    A Welsh tune in English dance books from the 1700s. "Ap" means "son of" in Welsh.
  staff:
    notes: D5:s C5:s  |  B4:q B4:e B4:e G5:e F#5:e
    key: G
  sound: D5:s C5:s  |  B4:q B4:e B4:e G5:e F#5:e  |  E5:q E5:e E5:e F#5:e G5:e  |  D5:e E5:e D5:e D5:e C5:e B4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
