title: Jig from the Water Music
skills:
- songs
steps:
- explain: |
    **Jig from the Water Music** · George Frideric Handel, 1717

    Handel wrote the Water Music for King George I to hear from a boat on the Thames.
  staff:
    notes: D4:e  |  G4:q Bb4:e A4:q C5:e
    key: G
  sound: D4:e  |  G4:q Bb4:e A4:q C5:e  |  Bb4:e C5:e D5:e G4:q A4:e  |  Bb4:e C5:e D5:e C5:e D5:e Eb5:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
