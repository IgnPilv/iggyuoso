- exercise: song-go-tell-aunt-rhody-by-ear
- exercise: song-go-tell-aunt-rhody-rh
- exercise: song-go-tell-aunt-rhody-lh
- exercise: song-go-tell-aunt-rhody
- exercise: song-go-tell-aunt-rhody-arranged
- exercise: song-go-tell-aunt-rhody-performance
recap: 'Go Tell Aunt Rhody: tune, left hand, together. Come back to it any time; songs are for fun.'
