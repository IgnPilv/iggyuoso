steps:
- explain: |
    **The Flowers of Edinburgh** · Scottish reel, 1740s

    A Scottish tune from the 1740s that crossed to America and became a favourite of old-time fiddlers.
  staff:
    notes: D4:q  |  G4:q G4:q B4:q G4:e B4:e
    key: G
  sound: D4:q  |  G4:q G4:q B4:q G4:e B4:e  |  D5:q B4:q G5:q. E5:e  |  D5:q B4:q B4:e A4:e G4:e A4:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
