title: The Little Stack of Barley
skills:
- songs
steps:
- explain: |
    **The Little Stack of Barley** · Irish hornpipe, 1800s

    A short, easy hornpipe, one of the first a young dancer learns to step to.
  staff:
    notes: B4:e. D5:s  |  E5:e. F#5:s E5:e D5:e B4:e E5:e D5:e B4:e
    key: G
  sound: B4:e. D5:s  |  E5:e. F#5:s E5:e D5:e B4:e E5:e D5:e B4:e  |  A4:e G4:e E4:e G4:e A4:e C5:e B4:e A4:e  |  G4:e F#4:e
    G4:e A4:e B4:e A4:e B4:e3 C5:e3 D5:e3
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/2 · Tempo: 60
