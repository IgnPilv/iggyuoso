id: song-eileen-aroon
title: Eileen Aroon
skills:
- songs
steps:
- explain: |
    **Eileen Aroon** · Irish air, 1600s

    One of the oldest Irish love songs. Handel is said to have loved it more than any of his own tunes.
  staff:
    notes: D5:e B4:e  |  A4:q B4:q D5:e B4:e
    key: D
  sound: D5:e B4:e  |  A4:q B4:q D5:e B4:e  |  D5:q E5:q F#5:q  |  F#4:q A4:q E5:e D5:e
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 3/4 · Tempo: 96
