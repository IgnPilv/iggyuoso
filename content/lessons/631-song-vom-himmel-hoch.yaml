- exercise: song-vom-himmel-hoch
- exercise: song-vom-himmel-hoch-arranged
- exercise: song-vom-himmel-hoch-performance
recap: 'Vom Himmel hoch: tune, left hand, together. Come back to it any time; songs are for fun.'
