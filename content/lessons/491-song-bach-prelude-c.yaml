title: Prelude in C
skills:
- songs
steps:
- explain: |
    **Prelude in C** · Johann Sebastian Bach, The Well-Tempered Clavier, Book 1, 1722

    The first piece of Bach's "Well-Tempered Clavier": no tune at all, just one chord per bar, broken the same way. The music is in how the chords move. Gounod later sang an "Ave Maria" over it.
