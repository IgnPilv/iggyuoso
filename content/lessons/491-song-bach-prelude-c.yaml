    G4:s C5:s E5:s r:e G4:s C5:s E5:s G4:s C5:s E5:s
- explain: |
    **Before you play.** In the fuller arrangement the left hand holds the two low notes and the right hand ripples the three high ones, twice a bar. Listen to which note changes from one chord to the next.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 60
