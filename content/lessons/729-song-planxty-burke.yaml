- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. G minor: remember B♭, E♭.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G minor · Time: 6/8 · Tempo: 56
