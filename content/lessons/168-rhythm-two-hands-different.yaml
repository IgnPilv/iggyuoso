id: rhythm-two-hands-different
title: Two rhythms at once
skills:
- rhythm
steps:
- explain: |
    The hands now play **different** rhythms that fit together. Learn each line alone for a moment,
    then join them. Listen for the beats where both hands land together: they are your anchors.
