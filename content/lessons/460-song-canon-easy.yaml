id: song-canon-easy
title: Pachelbel's Canon, easy
skills:
- songs
steps:
- explain: |
    **Pachelbel's Canon, easy**, the whole piece: the bass alone once, as the cello starts the real Canon, then the three
    lines of tune over it, and a C major chord to end. 17 bars, a little over a minute.

    The bass goes round four times without a break. When the tune comes in, keep the bass just as steady.
