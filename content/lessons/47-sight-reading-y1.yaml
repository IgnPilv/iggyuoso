id: sight-reading-y1
title: Sight-reading
unit: year-1-recital
skills: [sight-reading]
steps:
- explain: |
    **Sight-reading** means playing something you have never seen, first time, without stopping.
    It is a skill of its own, trained a little every day.
  terms: [sight-reading]
- explain: |
    Before you start, take ten seconds and check four things:
    the **key signature**, the **time signature**, the **starting note** (and hand position), and any **tricky spot**.
  staff: {notes: 'G4:q B4:q A4:q F#4:q | G4:h. r:q', key: G}
  check:
    ask: Before playing this, what does the key signature tell you?
    choices: [Every F is F♯, Every B is B♭, Play softly]
    correct: 0
    why: 'One sharp on the F line: F♯, the key of G.'
- explain: |
    Then keep the beat going whatever happens. A wrong note in time is better than a right note late:
    the listener notices stops much more than slips.
  callout: |
    Look ahead: your eyes should be a note or two in front of your fingers.
- {exercise: sight-read-g-position}
- {exercise: sight-read-waltz}
- {exercise: sight-read-d-minor-lh}
- explain: |
    The real thing: any of your keys, any five-finger position, with eighth notes. A little
    every day.
- {exercise: gen-sight-read-y1-rh}
- explain: |
    And the left hand.
- {exercise: gen-sight-read-y1-lh}
- explain: |
    Theory check. Every answer comes with the reason, so a wrong one still teaches you something.
- {exercise: sight-reading-prep-quiz}
recap: Look first (key, time, start note), then keep going no matter what.
