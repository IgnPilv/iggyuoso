id: song-endearing-young-charms
title: Believe Me, If All Those Endearing Young Charms
skills:
- songs
steps:
- explain: |
    **Believe Me, If All Those Endearing Young Charms** · Irish air; words by Thomas Moore, 1808

    Moore's promise to love someone just as much when their youth has faded. Harvard sings the same tune as "Fair Harvard".
  staff:
    notes: B4:e A4:e  |  G4:q. A4:e G4:q
    key: G
  sound: B4:e A4:e  |  G4:q. A4:e G4:q  |  G4:q B4:q D5:q  |  C5:q E5:q G5:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 96
