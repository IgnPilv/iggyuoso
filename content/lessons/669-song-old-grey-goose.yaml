title: The Old Grey Goose
skills:
- songs
steps:
- explain: |
    **The Old Grey Goose** · Irish jig, 1700s

    A long jig in six parts, each turning the tune a new way.
  staff:
    notes: E4:s F#4:s  |  G4:e B4:e G4:e F#4:e A4:e F#4:e
    key: Em
  sound: E4:s F#4:s  |  G4:e B4:e G4:e F#4:e A4:e F#4:e  |  G4:e E4:e E4:e E4:q F#4:e  |  D4:e F#4:e A4:e D5:e A4:e G4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. E minor: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: E minor · Time: 6/8 · Tempo: 56
