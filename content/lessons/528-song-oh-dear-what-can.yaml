title: Oh Dear, What Can the Matter Be?
skills:
- songs
steps:
- explain: |
    **Oh Dear, What Can the Matter Be?** · English song, 1790s

    Johnny is so long at the fair. A song in a lilting 6/8.
  staff:
    notes: B4:e C5:e  |  D5:q. D5:q.
    key: G
  sound: B4:e C5:e  |  D5:q. D5:q.  |  D5:e B4:e G5:e D5:e B4:e G4:e  |  C5:q. C5:q.
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
