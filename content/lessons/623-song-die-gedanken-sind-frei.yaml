id: song-die-gedanken-sind-frei
title: Die Gedanken sind frei
skills:
- songs
steps:
- explain: |
    **Die Gedanken sind frei** · German folk song, about 1800

    "Thoughts are free": no one can guess them, no prison can lock them up. A song of freedom sung through two centuries.
  staff:
    notes: G4:e G4:e  |  C5:q. D5:e E5:e C5:e
  sound: G4:e G4:e  |  C5:q. D5:e E5:e C5:e  |  G4:h E4:q  |  G4:q F4:q D4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: C major · Time: 3/4 · Tempo: 96
