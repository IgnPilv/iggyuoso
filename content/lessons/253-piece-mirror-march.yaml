id: piece-mirror-march
title: Mirror March
skills:
- repertoire
steps:
- explain: |
    **Mirror March** · Our own study

    A first piece for two hands that move like a mirror: every note in the right hand has a partner in the left, played by the same finger.
  staff:
    notes: C4:q D4:q E4:q C4:q  |  E4:q D4:q C4:h
  sound: C4:q D4:q E4:q C4:q  |  E4:q D4:q C4:h  |  C4:q E4:q G4:q E4:q  |  D4:q D4:q C4:h
- explain: |
    **How to learn it.** Both thumbs start on a C. Say the finger numbers out loud: both hands always use the same one.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
- exercise: piece-mirror-march-rh
- exercise: piece-mirror-march-lh
- exercise: piece-mirror-march
- exercise: piece-mirror-march-polish
recap: 'Mirror March: learned hands alone, then together, then performed.'
