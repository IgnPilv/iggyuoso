id: song-oh-susanna
title: Oh! Susanna
skills:
- songs
steps:
- explain: |
    **Oh! Susanna** · Stephen Foster, 1848

    Stephen Foster wrote it in 1848 and it travelled west with the gold rush. The upbeat "Oh I" comes before bar 1.
  staff:
    notes: C4:e D4:e  |  E4:q G4:q G4:q. A4:e
  sound: C4:e D4:e  |  E4:q G4:q G4:q. A4:e  |  G4:q E4:q C4:q. D4:e  |  E4:q E4:q D4:q C4:q
- explain: |
    **Before you play.** Dotted quarter and eighth: "long, short". Count "1 2 3 and 4" in the first bar.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 96
