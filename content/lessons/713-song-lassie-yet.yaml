id: song-lassie-yet
title: My Love She's But a Lassie Yet
skills:
- songs
steps:
- explain: |
    **My Love She's But a Lassie Yet** · Scottish tune, 1700s; words by Robert Burns

    A bouncing tune that skips between the low and high D, like a fiddler's bow crossing strings.
  staff:
    notes: B4:s C#5:s  |  D5:e D4:e F#4:e D4:e
    key: D
  sound: B4:s C#5:s  |  D5:e D4:e F#4:e D4:e  |  D5:e D4:e D4:e B4:s C#5:s  |  D5:e D4:e F#4:e D4:e
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 2/4 · Tempo: 72
