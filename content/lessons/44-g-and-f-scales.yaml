id: g-and-f-scales
title: G and F major scales
unit: scales-and-eighths
skills: [scales, keys]
steps:
- explain: |
    **G major** uses the same fingering as C, with **F♯** near the top. Finger 4 of the right hand
    plays F♯ on the way up.
  keys: {notes: G4 A4 B4 C5 D5 E5 F#5 G5, labels: fingers, fingers: 1 2 3 1 2 3 4 5}
  sound: G4:q A4:q B4:q C5:q D5:q E5:q F#5:q G5:q
- explain: |
    **F major** is different in the right hand: **1 2 3 4** with 4 on **B♭**, then thumb under to C.
    The thumb never plays a black key in these scales. The left hand fingering is the same as C.
  keys: {notes: F4 G4 A4 Bb4 C5 D5 E5 F5, labels: fingers, fingers: 1 2 3 4 1 2 3 4}
  callout: |
    Rule of thumb: thumbs go on white keys, never on a black key in easy scales.
  check:
    ask: 'F major, right hand: which finger plays B♭?'
    choices: ['1', '3', '4']
    correct: 2
    why: 1 2 3 4 on F G A B♭, so the thumb can tuck under to C.
- {exercise: g-scale-rh}
- {exercise: g-scale-lh}
- {exercise: f-scale-rh}
- {exercise: f-scale-lh}
- explain: |
    Theory check. Every answer comes with the reason, so a wrong one still teaches you something.
- {exercise: scale-fingering-quiz}
recap: G major like C, with F sharp. F major right hand puts 4 on B flat.
