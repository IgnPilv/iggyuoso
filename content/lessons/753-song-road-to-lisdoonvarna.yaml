- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. E minor: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: E minor · Time: 6/8 · Tempo: 56
