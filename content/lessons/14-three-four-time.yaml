id: three-four-time
title: Three beats in a bar
unit: steady-hands
skills: [time-signature, dotted-half-note]
steps:
- explain: |
    Not all music counts to four. A **waltz** counts **1, 2, 3, 1, 2, 3**.
    Listen to the strong first beat: **ONE**, two, three.
  sound: C3+C4:q E4:q E4:q | G2+B3:q D4:q D4:q | C3+C4:q E4:q E4:q | C3+C4:h.
  terms: [waltz, strong beat]
- explain: |
    Its time signature is **3/4**: three quarter-note beats in every bar.
    The top number counts the beats; the bottom 4 says each beat is a quarter note.
    Beat 1 of every bar is the strongest.
  staff: {notes: 'C4:q E4:q G4:q | E4:q D4:q C4:q'}
  terms: [3/4]
  check:
    ask: In 3/4, how many beats are in a bar?
    choices: [Four, Two, Three]
    correct: 2
    why: 'The top number of the time signature counts the beats: 3.'
- explain: |
    A **dotted half note** is a half note with a dot after it. The dot adds **half again**:
    2 + 1 = **3 beats**. In 3/4 it fills the whole bar.
  staff: {notes: 'C4:h. | E4:h.'}
  sound: C4:h. E4:h.
  terms: [dot, dotted half note]
  callout: |
    A dot after a note adds half of that note's value.
- {exercise: waltz-rh}
- {exercise: waltz-lh}
- explain: |
    New 3/4 rhythms every time. Feel the strong first beat.
- {exercise: gen-rhythm-three-four}
- explain: |
    Theory check. Every answer comes with the reason, so a wrong one still teaches you something.
- {exercise: three-four-quiz}
recap: 3/4 = three beats a bar, strong on 1. A dotted half note lasts 3 beats.
