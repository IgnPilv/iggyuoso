id: song-molly-malone
title: Molly Malone
skills:
- songs
steps:
- explain: |
    **Molly Malone** · James Yorkston, 1883

    "In Dublin's fair city": Molly sells cockles and mussels from her barrow, and her ghost still does. Dublin's unofficial anthem.
  staff:
    notes: D4:q  |  G4:q G4:q G4:q
    key: G
  sound: D4:q  |  G4:q G4:q G4:q  |  G4:e B4:q. G4:q  |  A4:q A4:q A4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 96
