id: song-rain-rain
title: Rain, Rain, Go Away
skills:
- songs
steps:
- explain: |
    **Rain, Rain, Go Away** · Children's chant, England

    Children all over the world sing this chant on just two or three notes: G, E and A. Musicians call it *sol–mi–la*.
  staff:
    notes: G4:h E4:h  |  G4:q G4:q E4:h
  sound: G4:h E4:h  |  G4:q G4:q E4:h  |  G4:q G4:q E4:q E4:q  |  A4:q G4:q E4:h
- explain: |
    **Before you play.** The left hand only changes in bars 4 and 8, to F for two beats and back to C.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 88
