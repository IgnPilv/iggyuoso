id: pieces-hands-together
title: "First pieces hands together"
unit: two-hands-at-once
skills: [repertoire, hands-together]
steps:
  - explain: |
      Two well-known tunes, now with the left hand. **Ode to Joy** is by Beethoven, from his
      Ninth Symphony (1824). Play the left hand quietly (p) and the melody a little louder (mf):
      the tune should sing on top.

      Practise each hand alone first if it's hard. That's what "hands apart, then together" means.
  - exercise: mary-lamb-ht
  - exercise: ode-to-joy-ht
recap: "Melody louder, accompaniment softer. Hands apart first, then together."
