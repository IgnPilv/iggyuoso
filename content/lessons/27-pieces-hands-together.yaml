id: pieces-hands-together
title: First pieces hands together
skills:
- repertoire
- hands-together
steps:
- explain: |
    Two well-known tunes, now with the left hand. **Ode to Joy** is by Beethoven, from his
    Ninth Symphony (1824). Today it is the anthem of the European Union.
  sound: E4:q E4:q F4:q G4:q | G4:q F4:q E4:q D4:q | C4:q C4:q D4:q E4:q | E4:q. D4:e D4:h
- explain: |
    Most piano music has a **melody** (the tune) and an **accompaniment** (the part that supports it).
    Play the left hand quietly (p) and the melody a little louder (mf): the tune should sing on top.
  terms:
  - melody
  - accompaniment
  - balance
  callout: |
    Hard bar? Play each hand alone a few times, then put them back together.
- exercise: mary-lamb-ht
- exercise: ode-to-joy-ht
recap: Melody louder, accompaniment softer.
