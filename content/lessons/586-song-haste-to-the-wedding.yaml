id: song-haste-to-the-wedding
title: Haste to the Wedding
skills:
- songs
steps:
- explain: |
    **Haste to the Wedding** · Irish and English jig, 1760s

    A jig first heard in a London play in 1767, still played at weddings today.
  staff:
    notes: F#4:s G4:s  |  A4:q A4:e A4:q F#5:e
    key: D
  sound: F#4:s G4:s  |  A4:q A4:e A4:q F#5:e  |  E5:e D5:e E5:e F#5:e D5:e B4:e  |  A4:q A4:e A4:e G4:e F#4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 6/8 · Tempo: 56
