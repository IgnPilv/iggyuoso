id: song-ich-hatt-einen-kameraden
title: Ich hatt' einen Kameraden
skills:
- songs
steps:
- explain: |
    **Ich hatt' einen Kameraden** · Friedrich Silcher, 1825; words by Ludwig Uhland, 1809

    "I had a comrade": a soldier's song for a friend lost in battle, still played at memorials in Germany.
  staff:
    notes: D4:q  |  G4:q B4:e B4:e B4:q A4:q
    key: G
  sound: D4:q  |  G4:q B4:e B4:e B4:q A4:q  |  G4:h D4:q G4:e A4:e  |  B4:q D5:q D5:q C5:q
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
