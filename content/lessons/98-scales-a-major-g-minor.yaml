id: scales-a-major-g-minor
title: "A major and G minor"
unit: pedal-and-genres
skills: [scales, keys]
steps:
  - explain: |
      **A major** has three sharps: **F#, C# and G#**. **G minor** is the relative minor of Bb
      major, so it has two flats, **Bb and Eb**, and the harmonic form raises the 7th to **F#**.

      Fingering: like C major again in both hands. That's six scales with the same fingering. The
      only thing that changes is which keys are black.
  - exercise: a-major-2oct-rh
  - exercise: a-major-2oct-ht
  - exercise: g-minor-2oct-rh
  - exercise: g-minor-2oct-ht
recap: "A major: F# C# G#. G harmonic minor: Bb Eb and F#."
