id: song-durangs-hornpipe
title: Durang's Hornpipe
skills:
- songs
steps:
- explain: |
    **Durang's Hornpipe** · American hornpipe, 1785

    Written for John Durang, the first famous American-born dancer, who danced it on the stage in Philadelphia.
  staff:
    notes: A4:e  |  D4:s A4:s F#4:s A4:s D4:s A4:s F#4:s A4:s
    key: D
  sound: A4:e  |  D4:s A4:s F#4:s A4:s D4:s A4:s F#4:s A4:s  |  B4:s C#5:s D5:s B4:s B4:s A4:s F#4:s A4:s  |  D4:s A4:s F#4:s
    A4:s D4:s A4:s F#4:s A4:s
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 2/4 · Tempo: 72
