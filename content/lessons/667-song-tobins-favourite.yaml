title: Tobin's Favourite
skills:
- songs
steps:
- explain: |
    **Tobin's Favourite** · Irish jig, 1800s

    A jig that climbs up a D major chord and comes tumbling back.
  staff:
    notes: A4:s F#4:s  |  D4:e F#4:e A4:e D5:e C#5:e D5:e
    key: D
  sound: A4:s F#4:s  |  D4:e F#4:e A4:e D5:e C#5:e D5:e  |  E5:e C#5:e A4:e C#5:e D5:e E5:e  |  F#5:e D5:e F#5:e G5:e F#5:e
    G5:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 6/8 · Tempo: 56
