id: relative-minor
title: Relative major and minor
skills: [theory, keys, minor]
steps:
- explain: |
    Play the white keys from **C to C**: that's C major, bright. Now the same white keys from
    **A to A**: same notes, but the music sounds darker. That's **A minor**.
  sound: C4:e D4:e E4:e F4:e G4:e A4:e B4:e C5:q | A3:e B3:e C4:e D4:e E4:e F4:e G4:e A4:q
- explain: |
    Keys that share the same notes (and the same key signature) are **relatives**.
    To find the relative minor of a major key, go **down three semitones** from its tonic, or up to its **6th degree**.
  keys: {notes: A3 C4, labels: names}
  terms: [relative major, relative minor]
  callout: |
    C major → A minor. G major → E minor. F major → D minor.
  check:
    ask: The relative minor of G major is...
    choices: [D minor, E minor, G minor]
    correct: 1
    why: G down three semitones (G, F♯, F, E) is E. Both have one sharp.
- explain: |
    The other way round: from a minor key, go **up three semitones** to find its relative major.
  check:
    ask: The relative major of D minor is...
    choices: [F major, D major, A major]
    correct: 0
    why: D up three semitones (D♯, E, F) is F. Both have one flat.
- {exercise: relative-minor-quiz}
recap: Relative keys share notes and key signature. The minor tonic is the major key's 6th degree.
