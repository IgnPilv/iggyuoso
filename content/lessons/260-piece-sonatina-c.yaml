steps:
- explain: |
    **Sonatina in C** · Our own piece, in classical style

    A small sonatina in the style of Clementi and Mozart: a singing right hand over an Alberti bass.
  staff:
    notes: C5:h E5:q G5:q  |  G5:h F5:h
  sound: C5:h E5:q G5:q  |  G5:h F5:h  |  D5:q F5:q A5:q F5:q  |  E5:h C5:h
- explain: |
    **How to learn it.** Keep the Alberti bass soft and even; the melody sings over it.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
