id: song-god-save-the-king
title: God Save the King
skills:
- songs
steps:
- explain: |
    **God Save the King** · British anthem, printed 1745

    The British national anthem since the 1740s. Its tune is also the anthem of Liechtenstein and was once used in many other countries.
  staff:
    notes: G4:q G4:q A4:q  |  F#4:q. G4:e A4:q
    key: G
  sound: G4:q G4:q A4:q  |  F#4:q. G4:e A4:q  |  B4:q B4:q C5:q  |  B4:q. A4:e G4:q
- explain: |
    **Before you play.** Three steady beats, with a dotted rhythm (long-short) in bars 2, 4, 8, 10 and 12.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 84
- exercise: song-god-save-the-king-tap
- exercise: song-god-save-the-king-by-ear
- exercise: song-god-save-the-king-rh
- exercise: song-god-save-the-king-lh
- exercise: song-god-save-the-king
- exercise: song-god-save-the-king-arranged
- exercise: song-god-save-the-king-performance
recap: 'God Save the King: tune, left hand, together. Come back to it any time; songs are for fun.'
