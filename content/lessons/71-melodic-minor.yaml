id: melodic-minor
title: The melodic minor scale
skills: [theory, scales, minor]
steps:
- explain: |
    The harmonic minor's big jump from 6 to 7 is awkward to sing. So for melodies, composers
    raise the **6th as well** on the way up: in A minor, **F♯ and G♯**.
  sound: A4:e B4:e C5:e D5:e E5:e F#5:e G#5:e A5:e
  terms: [melodic minor]
- explain: |
    Going up it sounds almost like a major scale, until you notice the minor 3rd at the bottom.
    Coming **down** the melodic minor uses the natural minor (G and F natural), because there is
    no need to pull up to the tonic when you're walking away from it.
  staff: {notes: 'A4:e B4:e C5:e D5:e E5:e F#5:e G#5:e A5:e | G5:e F5:e E5:e D5:e C5:e B4:e A4:q', labels: names}
  sound: A4:e B4:e C5:e D5:e E5:e F#5:e G#5:e A5:e G5:e F5:e E5:e D5:e C5:e B4:e A4:q
- explain: |
    So there are three minors: **natural** (the key signature), **harmonic** (raised 7th) and
    **melodic** (raised 6th and 7th going up, natural coming down).
  callout: |
    Natural: as the key. Harmonic: 7 up. Melodic: 6 and 7 up, then natural down.
  check:
    ask: A melodic minor coming down uses...
    choices: [G and F natural, G♯ and F♯, G♯ only]
    correct: 0
    why: Coming down, the melodic minor is the natural minor.
- {exercise: build-melodic-minor}
- {exercise: a-melodic-minor-rh}
- {exercise: which-minor}
recap: 'Three minors: natural, harmonic (7 up), melodic (6 and 7 up, natural down).'
