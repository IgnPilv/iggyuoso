id: melodic-minor
title: "The melodic minor scale"
unit: minor-keys
skills: [theory, scales, minor]
steps:
  - explain: |
      The harmonic minor's big jump from 6 to 7 is awkward to sing. So for melodies, composers
      raise the **6th as well** on the way up: in A minor, **F# and G#**. Going up it sounds almost
      like a major scale, until you notice the minor 3rd at the bottom.

      Coming **down** the melodic minor uses the natural minor (G and F natural), because there is
      no need to pull up to the tonic when you're walking away from it.

      So there are three minors: **natural** (the key signature), **harmonic** (raised 7th) and
      **melodic** (raised 6th and 7th going up, natural coming down).
  - exercise: build-melodic-minor
  - exercise: a-melodic-minor-rh
  - exercise: which-minor
recap: "Three minors: natural, harmonic (7 up), melodic (6 and 7 up, natural down)."
