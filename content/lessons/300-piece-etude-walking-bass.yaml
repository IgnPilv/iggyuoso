title: Walking Bass
skills:
- repertoire
steps:
- explain: |
    **Walking Bass** · Our own study

    The left hand walks in quarter notes under two-note chords.
  staff:
    notes: E4+G4:h E4+G4:h  |  F4+A4:h F4+A4:h
  sound: E4+G4:h E4+G4:h  |  F4+A4:h F4+A4:h  |  D4+F4:h D4+G4:h  |  E4+G4:w
- explain: |
    **How to learn it.** Steady quarters in the left hand, like footsteps.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
