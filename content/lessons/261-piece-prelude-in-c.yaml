    notes: r:e G4:s C5:s E5:s G4:s C5:s E5:s r:e G4:s C5:s E5:s G4:s C5:s E5:s  |  r:e A4:s D5:s F5:s A4:s D5:s F5:s r:e A4:s
      D5:s F5:s A4:s D5:s F5:s
  sound: r:e G4:s C5:s E5:s G4:s C5:s E5:s r:e G4:s C5:s E5:s G4:s C5:s E5:s  |  r:e A4:s D5:s F5:s A4:s D5:s F5:s r:e A4:s
    D5:s F5:s A4:s D5:s F5:s  |  r:e G4:s D5:s F5:s G4:s D5:s F5:s r:e G4:s D5:s F5:s G4:s D5:s F5:s  |  r:e G4:s C5:s E5:s
    G4:s C5:s E5:s r:e G4:s C5:s E5:s G4:s C5:s E5:s
- explain: |
    **How to learn it.** Learn the eight chords first as blocks. Then spread them. Pedal on each new bar.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
