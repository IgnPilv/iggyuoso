steps:
- explain: |
    **The Waters of Tyne** · Northumbrian song, 1700s

    A girl on one bank of the Tyne longs for her love on the other side.
  staff:
    notes: F#4:e G4:e  |  A4:q F#4:q F#4:q
    key: D
  sound: F#4:e G4:e  |  A4:q F#4:q F#4:q  |  A4:q F#4:q E4:q  |  D4:q D4:q. D4:e
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 3/4 · Tempo: 96
