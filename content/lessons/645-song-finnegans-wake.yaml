id: song-finnegans-wake
title: Finnegan's Wake
skills:
- songs
steps:
- explain: |
    **Finnegan's Wake** · Irish-American music-hall song, 1850s

    Tim Finnegan falls off a ladder, and wakes at his own wake when whiskey splashes on him. James Joyce named a book after it.
  staff:
    notes: B4:q. B4:e B4:q A4:q  |  B4:q D5:q E5:q D5:q
    key: G
  sound: B4:q. B4:e B4:q A4:q  |  B4:q D5:q E5:q D5:q  |  G5:e G5:e G5:e G5:e G5:q. E5:e  |  D5:q B4:q A4:h
- explain: |
    **Before you play.** G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/2 · Tempo: 60
