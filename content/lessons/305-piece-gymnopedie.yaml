id: piece-gymnopedie
title: 'Gymnopédie No. 1: the opening'
skills:
- repertoire
steps:
- explain: |
    **Gymnopédie No. 1: the opening** · Erik Satie, 1888 (opening, arranged)

    Slow, floating, and strange for its time: two gently rocking chords and a melody that drifts above them.
  staff:
    notes: r:h.  |  r:h.
    key: D
  sound: r:h.  |  r:h.  |  r:q F#5:q A5:q  |  G5:q F#5:q C#5:q
- explain: |
    **How to learn it.** The left hand leaps from a low bass note to a chord: look at the chord, not the bass. Change the pedal on every bass note.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
