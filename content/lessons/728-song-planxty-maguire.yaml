steps:
- explain: |
    **Planxty Maguire** · Turlough O'Carolan, early 1700s

    Carolan's tune for the Maguires of Fermanagh, in 2/4 with quick runs.
  staff:
    notes: D5:e  |  C5:s B4:s A4:s G4:s D5:e G4:e
    key: G
  sound: D5:e  |  C5:s B4:s A4:s G4:s D5:e G4:e  |  B4:e D5:e D5:e E5:s F#5:s  |  G5:e F#5:s E5:s A5:e G5:s F#5:s
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 72
