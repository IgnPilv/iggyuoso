id: harmony-modes
title: The modes
skills:
- theory
steps:
- explain: |
    Play the white keys from any note to the same note above and you get a **mode**. From C: **Ionian** (major). From D:
    **Dorian**. From E: **Phrygian**. From F: **Lydian**. From G: **Mixolydian**. From A: **Aeolian** (natural minor). From B:
    **Locrian**.
  keys:
    notes: C4 D4 E4 F4 G4 A4 B4 C5
    labels: names
  terms:
  - mode
  - Ionian
  - Dorian
  - Phrygian
  - Lydian
  - Mixolydian
  - Aeolian
  - Locrian
- explain: |
    Each mode is major or minor with **one note changed**: Dorian is minor with a raised 6th; Phrygian minor with a flat
    2nd; Lydian major with a raised 4th; Mixolydian major with a flat 7th.
  callout: |
    Dorian ♮6 · Phrygian ♭2 · Lydian ♯4 · Mixolydian ♭7
  sound: D4:q E4:q F4:q G4:q | A4:q B4:q C5:q D5:q | F4:q G4:q A4:q B4:q | C5:q D5:q E5:q F5:q
- exercise: harmony-modes-quiz
recap: Seven white-key modes, each one note away from major or minor.
