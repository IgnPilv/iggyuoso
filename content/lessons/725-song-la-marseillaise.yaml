- exercise: song-la-marseillaise-lh
- exercise: song-la-marseillaise
- exercise: song-la-marseillaise-arranged
- exercise: song-la-marseillaise-performance
recap: 'La Marseillaise: tune, left hand, together. Come back to it any time; songs are for fun.'
