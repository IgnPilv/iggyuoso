id: song-joy-to-the-world
title: Joy to the World
skills:
- songs
steps:
- explain: |
    **Joy to the World** · Arranged by Lowell Mason, 1839

    The opening is a C major scale coming down, one note at a time: you know this one from your scale practice.
  staff:
    notes: C5:h B4:q. A4:e  |  G4:h. F4:q
  sound: C5:h B4:q. A4:e  |  G4:h. F4:q  |  E4:h D4:h  |  C4:h. G4:q
- explain: |
    **Before you play.** Bar 1 to 4: the descending scale. Keep it even, like walking down stairs.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 88
