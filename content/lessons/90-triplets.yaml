id: triplets
title: "Triplets"
unit: harmonising
skills: [rhythm, triplets]
steps:
  - explain: |
      Two eighth notes split a beat in half. A **triplet** splits it into **three** equal parts.
      It is written as three eighths with a small **3** over them.

      Say **tri-po-let** (or "1-trip-let") on each click, evenly. Don't let it turn into a long-
      short-short rhythm: all three are the same length.
  - exercise: tap-triplets
  - exercise: triplets-rh
  - explain: |
      Fresh rhythms with triplets mixed in.
  - exercise: gen-rhythm-triplets
recap: "Three even notes in one beat: tri-po-let."
