- exercise: song-aennchen-von-tharau
- exercise: song-aennchen-von-tharau-arranged
- exercise: song-aennchen-von-tharau-performance
recap: 'Ännchen von Tharau: tune, left hand, together. Come back to it any time; songs are for fun.'
