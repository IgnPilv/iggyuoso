id: song-cliffs-of-moher
title: The Cliffs of Moher
skills:
- songs
steps:
- explain: |
    **The Cliffs of Moher** · Irish jig, 1800s

    Named after the great sea cliffs of County Clare.
  staff:
    notes: D5:e  |  G5:e F#5:e G5:e A5:e G5:e F#5:e
    key: G
  sound: D5:e  |  G5:e F#5:e G5:e A5:e G5:e F#5:e  |  D5:e G5:e G5:e F#5:e D5:e C5:e  |  A4:e G4:e G4:e A4:s G4:s F#4:e E4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
