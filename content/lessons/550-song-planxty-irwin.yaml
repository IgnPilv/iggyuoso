- exercise: song-planxty-irwin-lh
- exercise: song-planxty-irwin
- exercise: song-planxty-irwin-arranged
- exercise: song-planxty-irwin-performance
recap: 'Planxty Irwin: tune, left hand, together. Come back to it any time; songs are for fun.'
