- exercise: song-a-a-a-der-winter-by-ear
- exercise: song-a-a-a-der-winter-rh
- exercise: song-a-a-a-der-winter-lh
- exercise: song-a-a-a-der-winter
- exercise: song-a-a-a-der-winter-arranged
- exercise: song-a-a-a-der-winter-performance
recap: 'A, a, a, der Winter, der ist da: tune, left hand, together. Come back to it any time; songs are for fun.'
