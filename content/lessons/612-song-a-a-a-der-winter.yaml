id: song-a-a-a-der-winter
title: A, a, a, der Winter, der ist da
skills:
- songs
steps:
- explain: |
    **A, a, a, der Winter, der ist da** · German children's song, 1800s

    A song of the vowels: "A, a, a, winter is here", then e, e, e for the snow, and so on through the seasons.
  staff:
    notes: B4:q C5:q  |  D5:q r:e C5:e
    key: G
  sound: B4:q C5:q  |  D5:q r:e C5:e  |  B4:e B4:e A4:e A4:e  |  G4:q r:q
- explain: |
    **Before you play.** Two beats in a bar, like a march. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 88
