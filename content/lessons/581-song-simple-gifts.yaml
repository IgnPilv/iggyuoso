id: song-simple-gifts
title: Simple Gifts
skills:
- songs
steps:
- explain: |
    **Simple Gifts** · Shaker song, Joseph Brackett, 1848

    A dance song of the Shakers, an American religious group. Aaron Copland used it in "Appalachian Spring".
  staff:
    notes: D4:q  |  G4:q G4:e G4:e B4:e A4:e B4:e C5:e
    key: G
  sound: D4:q  |  G4:q G4:e G4:e B4:e A4:e B4:e C5:e  |  D5:q D5:e D5:e B4:q B4:e B4:e  |  A4:q A4:q A4:q A4:e B4:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
