id: song-ricketts-hornpipe
title: Rickett's Hornpipe
skills:
- songs
steps:
- explain: |
    **Rickett's Hornpipe** · American hornpipe, 1790s

    Named after John Bill Ricketts, who ran the first circus in America; George Washington went to see it.
  staff:
    notes: A4:s3 B4:s3 C#5:s3  |  D5:s C#5:s D5:s A4:s F#4:s A4:s D5:s F#5:s
    key: D
  sound: A4:s3 B4:s3 C#5:s3  |  D5:s C#5:s D5:s A4:s F#4:s A4:s D5:s F#5:s  |  E5:s D5:s C#5:s B4:s A4:e G5:e  |  F#5:s G5:s
    A5:s F#5:s G5:s F#5:s E5:s D5:s
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 2/4 · Tempo: 72
