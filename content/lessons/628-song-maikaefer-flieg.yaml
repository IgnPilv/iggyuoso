- explain: |
    **Before you play.** Two beats in a bar, like a march. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 88
