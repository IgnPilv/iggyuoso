- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. D minor: remember B♭.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D minor · Time: 4/4 · Tempo: 88
