- explain: |
    **Before you play.** Four eighths, then a quarter: the same rhythm in almost every bar.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: F major · Time: 2/4 · Tempo: 116
