id: two-note-chords
title: "Two notes at once"
unit: reading-hands-together
skills: [reading, double-notes]
steps:
  - explain: |
      A chord doesn't need three notes. Two notes played together are called a **double note** or
      a **dyad**. On the staff they sit on top of each other on one stem.

      In 3rds the notes are both on lines or both in spaces. In 5ths there is one empty line or
      space between them. Your eye can see the shape before you name the notes.
  - exercise: thirds-rh
  - exercise: fifths-lh
  - explain: |
      Now a melody over left-hand 5ths. The left hand moves very little; let the right hand sing.
  - exercise: dyads-ht
recap: "Two notes on one stem are played together. Read the shape first, then the names."
