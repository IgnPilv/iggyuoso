id: piece-eine-kleine
title: 'Eine kleine Nachtmusik: the opening'
skills:
- repertoire
steps:
- explain: |
    **Eine kleine Nachtmusik: the opening** · W. A. Mozart, 1787 (first bars, arranged)

    A serenade for strings that Mozart finished in 1787. Its opening is one of the best known in all music: a rising call, answered.
  staff:
    notes: G4:q r:e D4:e G4:q r:e D4:e  |  G4:e D4:e G4:e B4:e D5:h
    key: G
  sound: G4:q r:e D4:e G4:q r:e D4:e  |  G4:e D4:e G4:e B4:e D5:h  |  C5:q r:e A4:e C5:q r:e A4:e  |  C5:e A4:e F#4:e A4:e
    D4:h
- explain: |
    **How to learn it.** Short and bright: lift after each quarter note. The second bar rises to a held D; the fourth falls to one.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
- exercise: piece-eine-kleine-tap
- exercise: piece-eine-kleine-rh
- exercise: piece-eine-kleine-lh
- exercise: piece-eine-kleine
- exercise: piece-eine-kleine-polish
recap: 'Eine kleine Nachtmusik: the opening: learned hands alone, then together, then performed.'
