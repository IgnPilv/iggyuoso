id: song-butzemann
title: Es tanzt ein Bi-Ba-Butzemann
skills:
- songs
steps:
- explain: |
    **Es tanzt ein Bi-Ba-Butzemann** · German children's dance song, 1800s

    A little goblin dances round the house, shaking his sack, while the children dance in a ring.
  staff:
    notes: D4:e  |  G4:q B4:q
    key: G
  sound: D4:e  |  G4:q B4:q  |  D5:q G5:q  |  E5:e. E5:s E5:e E5:e
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 72
