id: technique-repeated-notes
title: Changing fingers on one key
skills:
- technique
steps:
- explain: |
    Playing the same key again and again goes smoother when the fingers take turns: 3, 2, 1. Lift each finger as the next one plays.
- exercise: repeated-c-321
- exercise: repeated-lh
recap: A new finger for each repeat keeps the key alive.
