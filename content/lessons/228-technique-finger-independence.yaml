id: technique-finger-independence
title: Quiet fingers
skills:
- technique
steps:
- explain: |
    Hold some fingers down while others play: it trains each finger to move on its own. Keep the held keys down all bar.
- exercise: indep-hold-thumb
- exercise: indep-thirds-held
- exercise: indep-legato-staccato
recap: Fingers that move on their own.
