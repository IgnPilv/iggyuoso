- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G minor: remember B♭, E♭.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G minor · Time: 4/4 · Tempo: 72
