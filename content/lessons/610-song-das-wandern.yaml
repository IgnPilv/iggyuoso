- exercise: song-das-wandern-lh
- exercise: song-das-wandern
- exercise: song-das-wandern-arranged
- exercise: song-das-wandern-performance
recap: 'Das Wandern ist des Müllers Lust: tune, left hand, together. Come back to it any time; songs are for fun.'
