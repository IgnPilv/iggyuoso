id: song-mary-lamb
title: Mary Had a Little Lamb
skills:
- songs
steps:
- explain: |
    **Mary Had a Little Lamb** · Tune by Lowell Mason, words by Sarah Josepha Hale, 1830

    A poem about a real girl whose lamb followed her to school, set to a simple tune in 1830.
  staff:
    notes: E4:q D4:q C4:q D4:q  |  E4:q E4:q E4:h
  sound: E4:q D4:q C4:q D4:q  |  E4:q E4:q E4:h  |  D4:q D4:q D4:h  |  E4:q G4:q G4:h
- explain: |
    **Before you play.** Right thumb on C. Only the left hand moves, once, to G in bar 3 and bar 7.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 4/4 · Tempo: 96
