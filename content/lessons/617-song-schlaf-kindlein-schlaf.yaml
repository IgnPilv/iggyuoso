    notes: A4:q G4:e G4:e  |  F4:q r:e F4:s A4:s
    key: F
  sound: A4:q G4:e G4:e  |  F4:q r:e F4:s A4:s  |  C5:e C5:e Bb4:e Bb4:e  |  A4:q r:e A4:e
- explain: |
    **Before you play.** Two beats in a bar, like a march. F major: remember B♭.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: F major · Time: 2/4 · Tempo: 72
