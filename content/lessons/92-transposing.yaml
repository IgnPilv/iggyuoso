id: transposing
title: "Moving a tune to a new key"
unit: harmonising
skills: [creativity, transposition, keys]
steps:
  - explain: |
      To **transpose** is to play the same tune starting on a different note. Every interval stays
      the same, so it sounds like the same song, just higher or lower.

      The easy way on the piano: think in **degrees**, not letters. Lightly Row starts on degree 5
      and goes 5 3 3, 4 2 2, 1 2 3 4, 5 5 5. In G, degree 5 is D. In F, it's C, and degree 4 is
      **Bb**. Same fingers, new key.
  - exercise: lightly-row-in-g
  - exercise: lightly-row-in-f
recap: "Think in degrees, and any tune can move to any key."
