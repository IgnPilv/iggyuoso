id: ear-degree-3-and-thirds
title: "Degree 3, major and minor thirds"
unit: scales-and-eighths
skills: [scale-degrees, intervals, listening]
steps:
  - explain: |
      **3** sits between home and 5. It gives the key its colour: in major it's bright, in minor
      it's a semitone lower and darker. That's why a **major third** (4 semitones) and a **minor
      third** (3 semitones) are the first intervals worth hearing.
  - exercise: ear-degree-three
  - exercise: ear-major-minor-thirds
recap: "Degree 3 colours the key. Major third = bright, minor third = dark."
