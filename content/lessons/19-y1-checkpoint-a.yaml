steps:
- explain: |
    Checkpoint time. This mixes everything since the start: theory, smooth playing, rhythm, your
    ears and a piece. Take it whenever you feel ready, and as many times as you like.
    It counts best on a different day from when you learned the skills, because that shows
    they have really stuck.
  callout: |
    No hints in checkpoint quizzes: the answers and their reasons come at the end.
