id: song-tipperary
title: It's a Long Way to Tipperary
skills:
- songs
steps:
- explain: |
    **It's a Long Way to Tipperary** · Jack Judge and Harry Williams, 1912

    A music-hall song that soldiers sang marching through France in the First World War.
  staff:
    notes: F#4:q G4:q  |  A4:h A4:h
    key: D
  sound: F#4:q G4:q  |  A4:h A4:h~  |  A4:q A4:q B4:q C#5:q  |  D5:h F#5:h
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 4/4 · Tempo: 88
