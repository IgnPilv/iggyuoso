id: song-happy-birthday
title: Happy Birthday
skills:
- songs
steps:
- explain: |
    **Happy Birthday** · Mildred and Patty Hill, 1893; public domain

    The tune began as a classroom greeting song, "Good Morning to All", in 1893. It is now free for everyone to play.
  staff:
    notes: G3:e G3:e  |  A3:q G3:q C4:q
  sound: G3:e G3:e  |  A3:q G3:q C4:q  |  B3:h G3:e G3:e  |  A3:q G3:q D4:q
- explain: |
    **Before you play.** Starts on an upbeat. The big leap in bar 5 goes up an octave: G below middle C to the G above it.

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 3/4 · Tempo: 100
