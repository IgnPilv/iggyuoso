id: song-a-la-claire-fontaine
title: À la claire fontaine
skills:
- songs
steps:
- explain: |
    **À la claire fontaine** · French song, 1600s, sung in France and Québec

    "At the clear fountain": a French song that sailed to Canada in the 1600s and became almost a second anthem in Québec.
  staff:
    notes: F4:h F4:q  |  A4:h A4:q
    key: F
  sound: F4:h F4:q  |  A4:h A4:q  |  A4:q G4:q A4:q  |  F4:h.
- explain: |
    **Before you play.** Three gentle beats. Bars 1 and 2 hold the first note for two beats: count them.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: F major · Time: 3/4 · Tempo: 92
