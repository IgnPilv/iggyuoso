id: ear-function-six-chords
title: Hearing ii and vi
skills:
- ear
steps:
- explain: |
    Now the minor chords join in. **vi** sounds like a sad I; **ii** like a soft IV. Listen to the bass: it tells you the
    root.
  sound: C3+C4+E4+G4:h A2+C4+E4+A4:h | F2+C4+F4+A4:h D3+D4+F4+A4:h | G2+D4+G4+B4:h C3+E4+G4+C5:h | C2+C4+E4+G4:w
  terms:
  - function
- exercise: ear-function-five
- exercise: ear-function-five-keys
recap: Every chord has a job; the ear can learn the jobs.
