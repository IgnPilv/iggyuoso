steps:
- explain: |
    **The Girl I Left Behind Me** · English and Irish fife tune, 1700s

    Played by the fifes and drums as a regiment marched out of town, leaving its sweethearts behind.
  staff:
    notes: G5:s F#5:s  |  E5:e D5:e B4:e G4:e
    key: G
  sound: G5:s F#5:s  |  E5:e D5:e B4:e G4:e  |  A4:e G4:e E4:e. F#4:s  |  G4:e G4:e G4:e B4:e
- explain: |
    **Before you play.** Two beats in a bar, like a march. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 2/4 · Tempo: 72
