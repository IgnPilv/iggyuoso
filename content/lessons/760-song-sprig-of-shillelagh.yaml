id: song-sprig-of-shillelagh
title: The Sprig of Shillelagh
skills:
- songs
steps:
- explain: |
    **The Sprig of Shillelagh** · Irish jig, 1800s

    A shillelagh is a blackthorn walking stick; this jig comes from a comic song about one.
  staff:
    notes: D4:e  |  D4:e G4:e G4:e G4:e F#4:e G4:e
    key: G
  sound: D4:e  |  D4:e G4:e G4:e G4:e F#4:e G4:e  |  A4:e C5:e B4:e A4:e G4:e F#4:e  |  G4:e D5:e D5:e D5:e C5:e B4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
