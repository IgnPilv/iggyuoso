id: creativity-transpose-tune
title: One tune, four keys
skills:
- creativity
steps:
- explain: |
    Play the same tune with its chords in C, G, F and D. Think in **degrees**: the tune is 3 2 1 2 3 3 3, whatever the key.
- exercise: cr-mary-in-g
- exercise: cr-mary-in-f
- exercise: cr-mary-in-d
recap: Degrees travel; letters change.
