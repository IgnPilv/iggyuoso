    B4:q A4:e G4:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. E minor: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: E minor · Time: 4/4 · Tempo: 72
