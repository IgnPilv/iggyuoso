id: song-good-king-wenceslas
title: Good King Wenceslas
skills:
- songs
steps:
- explain: |
    **Good King Wenceslas** · Spring carol "Tempus adest floridum", Piae Cantiones, 1582

    The tune was a spring song printed in Finland in 1582; the words about the good king of Bohemia were added in 1853.
  staff:
    notes: G4:q G4:q G4:q A4:q  |  G4:q G4:q D4:h
    key: G
  sound: G4:q G4:q G4:q A4:q  |  G4:q G4:q D4:h  |  E4:q D4:q E4:q F#4:q  |  G4:h G4:h
- explain: |
    **Before you play.** All quarters and halves. G major: F♯ in bars 3 and 7.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 96
