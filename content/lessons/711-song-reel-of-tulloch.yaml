id: song-reel-of-tulloch
title: The Reel of Tulloch
skills:
- songs
steps:
- explain: |
    **The Reel of Tulloch** · Scottish reel, 1700s

    Said to have been made up outside a church in Tulloch, where people stamped and danced to keep warm waiting for the minister.
  staff:
    notes: B4:e  |  C#5:e. A4:s C#5:s D5:s E5:e C#5:e. A4:s A4:e B4:e
    key: A
  sound: B4:e  |  C#5:e. A4:s C#5:s D5:s E5:e C#5:e. A4:s A4:e B4:e  |  C#5:e. A4:s C#5:s D5:s E5:e D5:e. B4:s G4:s B4:e.  |  C#5:e
    A4:e C#5:s D5:s E5:e C#5:e C#5:e D5:e E5:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. A major: remember F♯, C♯, G♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: A major · Time: 2/2 · Tempo: 60
