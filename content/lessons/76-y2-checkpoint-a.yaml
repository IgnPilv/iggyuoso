      The first Year 2 checkpoint. Two-octave scales hands together, minor keys, reading with both
      hands, and your ears. Take it on a fresh day, warmed up but not tired.
  - exercise: c-scale-2oct-ht
  - exercise: a-minor-2oct-ht
  - exercise: sight-read-y2-am
  - exercise: ear-y2-checkpoint-a
  - exercise: cadences-checkpoint-a
  - exercise: korobeiniki
recap: "Two octaves, three minors, and reading with both hands: a third of Year 2 done."
