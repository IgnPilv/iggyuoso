id: song-scotland-the-brave
title: Scotland the Brave
skills:
- songs
steps:
- explain: |
    **Scotland the Brave** · Scottish pipe tune, about 1900

    A pipe-band march heard at every Highland gathering. The bagpipes play it in their own scale; here it sits in G major.
  staff:
    notes: D4:q  |  G4:h G4:q. A4:e
    key: G
  sound: D4:q  |  G4:h G4:q. A4:e  |  B4:q G4:q B4:q D5:q  |  G5:h G5:q. F#5:e
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
- exercise: song-scotland-the-brave-tap
- exercise: song-scotland-the-brave-rh
- exercise: song-scotland-the-brave-lh
- exercise: song-scotland-the-brave
- exercise: song-scotland-the-brave-arranged
- exercise: song-scotland-the-brave-performance
recap: 'Scotland the Brave: tune, left hand, together. Come back to it any time; songs are for fun.'
