id: song-the-mulberry-bush
title: Here We Go Round the Mulberry Bush
skills:
- songs
steps:
- explain: |
    **Here We Go Round the Mulberry Bush** · English singing game, 1840s

    Children walk in a ring and act out the verses: "this is the way we wash our clothes, so early Monday morning".
  staff:
    notes: C4:q C4:e C4:q E4:e  |  G4:q E4:e C4:q.
  sound: C4:q C4:e C4:q E4:e  |  G4:q E4:e C4:q.  |  D4:q D4:e D4:q B3:e  |  G3:q. G3:q.
- explain: |
    **Before you play.** Two big beats a bar. Bar 4 leaps down to G below middle C.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: C major · Time: 6/8 · Tempo: 58
- exercise: song-the-mulberry-bush-rh
- exercise: song-the-mulberry-bush-lh
- exercise: song-the-mulberry-bush
- exercise: song-the-mulberry-bush-arranged
- exercise: song-the-mulberry-bush-performance
recap: 'Here We Go Round the Mulberry Bush: tune, left hand, together. Come back to it any time; songs are for fun.'
