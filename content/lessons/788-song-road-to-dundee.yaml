title: The Road to Dundee
skills:
- songs
steps:
- explain: |
    **The Road to Dundee** · Scottish song, 1800s

    A young man walks a girl along the road to Dundee on a cold winter morning and gives her a gift at parting.
  staff:
    notes: D5:q  |  D5:q. C5:e B4:q
    key: G
  sound: D5:q  |  D5:q. C5:e B4:q  |  B4:q A4:q D4:q  |  G4:q F#4:q E4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 3/4 · Tempo: 96
