id: theory-transposition
title: Transposing on paper
skills:
- theory
steps:
- explain: |
    To **transpose**, move every note by the same interval and use the new key's signature. Do it by **degrees**: in C, C E G
    is 1 3 5; in G, 1 3 5 is G B D.
  staff:
    notes: C4:q E4:q G4:h | G4:q B4:q D5:h
  check:
    ask: C D E in F major becomes...
    choices:
    - F G A♭
    - F G A
    - F G B♭
    correct: 1
    why: '1 2 3 of F major: F G A.'
- exercise: theory-transposition-quiz
recap: Think in degrees, and the key does the rest.
