id: reading-two-hands-first
title: Reading both hands
skills:
- reading
steps:
- explain: |
    Your first two-hand reading: the right hand plays a tune, the left hand holds the key note or the fifth. Read
    the **top line**; glance down only when the left hand changes.
- exercise: rd-sight-together-c
- exercise: rd-sight-together-c-g
recap: Read the tune, feel the bass.
