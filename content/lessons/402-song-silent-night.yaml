id: song-silent-night
title: Silent Night
skills:
- songs
steps:
- explain: |
    **Silent Night** · Franz Gruber, 1818

    First sung on Christmas Eve 1818 in a village church in Austria, with a guitar because the organ was broken.
  staff:
    notes: G4:q. A4:e G4:q  |  E4:h.
  sound: G4:q. A4:e G4:q  |  E4:h.  |  G4:q. A4:e G4:q  |  E4:h.
- explain: |
    **Before you play.** A gentle rocking 3/4. The dotted quarter takes a beat and a half: "1 – and 2".

    The steps: the tune, the left hand, then both together. Last, a fuller arrangement.
  callout: |
    Key: C major · Time: 3/4 · Tempo: 72
