id: piece-blues-in-c
title: Blues in C
skills:
- repertoire
steps:
- explain: |
    **Blues in C** · Our own piece

    Twelve bars of blues: a boogie left hand and a right hand built from the blues scale.
  staff:
    notes: G4:q Bb4:q C5:h  |  G4:q Bb4:q C5:q Eb5:q
  sound: G4:q Bb4:q C5:h  |  G4:q Bb4:q C5:q Eb5:q  |  C5:q Bb4:q G4:h  |  Bb4:q G4:q C5:h
- explain: |
    **How to learn it.** Learn the left hand until it runs by itself. Then the right hand can talk over it.
  callout: |
    Hands alone first, then together slowly. Loop the hardest bars.
