title: The Minstrel Boy
skills:
- songs
steps:
- explain: |
    **The Minstrel Boy** · Irish air "The Moreen"; words by Thomas Moore, 1813

    A young harper goes to war with his father's sword and his harp. A proud, slow march.
  staff:
    notes: D4:q  |  G4:h. A4:q
    key: G
  sound: D4:q  |  G4:h. A4:q  |  C5:q B4:q A4:q G4:q  |  B4:h D5:h
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
