title: Arkansas Traveler
skills:
- songs
steps:
- explain: |
    **Arkansas Traveler** · American fiddle tune, 1840s

    A fiddle tune with a comic story: a traveller meets a farmer who plays only the first half of this tune.
  staff:
    notes: E4:q  |  A4:e C#5:e B4:e A4:e F#4:q F#4:q
    key: A
  sound: E4:q  |  A4:e C#5:e B4:e A4:e F#4:q F#4:q  |  E4:q E4:q A4:q. A4:e  |  B4:q B4:q C#5:q C#5:q
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. A major: remember F♯, C♯, G♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: A major · Time: 4/4 · Tempo: 88
