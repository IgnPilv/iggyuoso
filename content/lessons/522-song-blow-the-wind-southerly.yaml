id: song-blow-the-wind-southerly
title: Blow the Wind Southerly
skills:
- songs
steps:
- explain: |
    **Blow the Wind Southerly** · Northumbrian song, 1800s

    A woman watches the sea and wishes for a south wind to bring her sailor home.
  staff:
    notes: A4:q  |  F#5:q. E5:e D5:q
    key: D
  sound: A4:q  |  F#5:q. E5:e D5:q  |  A4:q F#4:q A4:q  |  B4:q G4:q B4:q
- explain: |
    **Before you play.** Three beats in a bar: feel the first one a little stronger. It starts on an upbeat: the first note comes before the first full bar. D major: remember F♯, C♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: D major · Time: 3/4 · Tempo: 96
