id: finger-numbers
title: Finger numbers
skills: [finger-numbers, hand-shape]
steps:
- explain: |
    Each finger has a number, so music can tell you which finger to use.
    The **thumb is 1**, the pointer 2, the middle finger 3, the ring finger 4 and the little finger 5.
  keys: {notes: C4 D4 E4 F4 G4, labels: fingers, fingers: 1 2 3 4 5}
  terms: [finger numbers, thumb = 1]
- explain: |
    The numbers are the **same on both hands**: thumbs are always 1.
    Because the hands are mirror pictures, the left hand counts the other way on the keyboard:
    little finger 5 on the left, thumb 1 on the right.
  keys: {notes: F3 G3 A3 B3 C4, labels: fingers, fingers: 5 4 3 2 1}
  check:
    ask: Which finger is number 4?
    choices: [The middle finger, The ring finger, The little finger]
    correct: 1
    why: 'Count from the thumb: thumb 1, pointer 2, middle 3, ring 4, little 5.'
- explain: |
    Sit tall, feet flat, elbows a little in front of your body.
    Curve your fingers as if you were holding a small ball, and play with the **round tips**, not the flat part.
  callout: |
    Loose wrist, round hand, firm fingertips.
- explain: |
    Put your **right** thumb on the lit key and let each finger rest on its own white key.
    Press the finger the app asks for. The other fingers stay on their keys.
- {exercise: finger-drill-rh}
- explain: |
    Now the **left** hand, with its **thumb on middle C** and the other fingers on the white keys below it.
    This time your **little finger (5)** is on the left and your thumb on the right.
  keys: {notes: F3 G3 A3 B3 C4, labels: fingers, fingers: 5 4 3 2 1}
  check:
    ask: In the left hand, which finger plays the lowest key of the five?
    choices: ['1', '3', '5']
    correct: 2
    why: The left hand's little finger is on the left, so it plays the lowest key.
- {exercise: finger-drill-lh}
- explain: |
    Theory check. Every answer comes with the reason, so a wrong one still teaches you something.
- {exercise: finger-numbers-quiz}
recap: Thumbs are 1, little fingers are 5, on both hands. Curved fingers, play on the tips.
