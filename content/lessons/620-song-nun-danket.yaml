id: song-nun-danket
title: Now Thank We All Our God
skills:
- songs
steps:
- explain: |
    **Now Thank We All Our God** · Johann Crüger, 1647; words by Martin Rinkart, 1636

    Rinkart, a pastor, wrote it during the Thirty Years' War. Bach and Mendelssohn both built music on this chorale.
  staff:
    notes: D5:q  |  D5:q D5:q E5:q E5:q
    key: G
  sound: D5:q  |  D5:q D5:q E5:q E5:q  |  D5:h. B4:q  |  C5:q B4:q A4:q B4:q
- explain: |
    **Before you play.** It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 88
