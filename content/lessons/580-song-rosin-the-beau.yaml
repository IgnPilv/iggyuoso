id: song-rosin-the-beau
title: Rosin the Beau
skills:
- songs
steps:
- explain: |
    **Rosin the Beau** · American and Irish song, 1830s

    A song about an old drinker, "Rosin the bow", whose tune was used for many political songs.
  staff:
    notes: D4:e  |  G4:q G4:e B4:e A4:e G4:e
    key: G
  sound: D4:e  |  G4:q G4:e B4:e A4:e G4:e  |  D5:q. E5:e F#5:e G5:e  |  D5:e B4:e G4:e G4:e A4:e B4:e
- explain: |
    **Before you play.** Two big beats in a bar, each a dotted quarter split in three. It starts on an upbeat: the first note comes before the first full bar. G major: remember F♯.

    The steps: the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 6/8 · Tempo: 56
