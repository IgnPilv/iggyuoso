id: song-old-hundredth
title: Old Hundredth
skills:
- songs
steps:
- explain: |
    **Old Hundredth** · Hymn tune by Louis Bourgeois, Geneva, 1551

    One of the oldest hymn tunes still sung, from the Genevan Psalter of 1551. In English churches it carries the words "Praise God, from whom all blessings flow".
  staff:
    notes: G4:h G4:q F#4:q  |  E4:q D4:q G4:q A4:q
    key: G
  sound: G4:h G4:q F#4:q  |  E4:q D4:q G4:q A4:q  |  B4:h r:q B4:q  |  B4:q B4:q A4:q G4:q
- explain: |
    **Before you play.** Every line starts and ends with a long note; the notes between walk by step.

    The steps: the rhythm, the tune, the left hand, then both together, a fuller left hand, and a performance.
  callout: |
    Key: G major · Time: 4/4 · Tempo: 80
